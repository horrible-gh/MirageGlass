<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MirageGlass</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/locales/ko.js" defer></script>
  <script src="/static/common.js" defer></script>
  <script src="/static/viewer.js" defer></script>
  <script src="/static/library.js" defer></script>
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar" aria-label="Library navigation">
    <a class="brand" href="#"><span class="brand-mark" aria-hidden="true"></span><span><strong>MirageGlass</strong><small>DESIGN LIBRARY</small></span></a>
    <div class="side-label" data-i18n="workspace"></div>
    <button class="side-link" id="nav-all" data-nav="all"><span data-icon="grid"></span><span data-i18n="all"></span><span class="count" id="nav-total"></span></button>
    <button class="side-link" id="nav-recent" data-nav="recent"><span data-icon="clock"></span><span data-i18n="recent"></span></button>
    <button class="side-link" id="nav-pinned" data-nav="pinned"><span data-icon="star"></span><span data-i18n="favorites"></span><span class="count" id="nav-favorite-count"></span></button>
    <div class="side-divider"></div>
    <div class="side-heading"><span class="side-label" data-i18n="groups"></span><button id="lib-new-group" class="side-add" data-i18n-label="newGroup" data-icon="plus"></button></div>
    <div id="project-nav"></div>
    <div class="sidebar-subsection"><button class="side-link" data-nav="ungrouped" id="nav-ungrouped" data-group-id=""><span class="uncat-icon" aria-hidden="true">◌</span><span data-i18n="ungrouped"></span><span class="count" id="nav-ungrouped-count"></span></button></div>
    <div class="sidebar-spacer"></div>
  </aside>
  <button id="mobile-shade" tabindex="-1" data-i18n-label="hideMenu" hidden></button>
  <main class="main">
    <header class="topbar" id="lib-bar">
      <button id="mobile-menu" class="button icon-only" data-i18n-label="menu" aria-expanded="false" aria-controls="sidebar" data-icon="menu"></button>
      <div id="breadcrumbs"><span class="crumb" data-i18n="library"></span><span class="crumb-divider">/</span><span class="crumb strong" id="current-crumb"></span></div>
      <div class="top-space"></div>
      <label class="search"><span data-icon="search"></span><input id="lib-search" type="search" data-i18n-label="search" data-i18n-placeholder="search"><kbd>⌘ K</kbd></label>
      <button id="library-refresh" class="button icon-only subtle" data-i18n-label="refresh" data-icon="refresh"></button>
      <button id="library-more" class="button icon-only subtle" data-i18n-label="moreActions" aria-haspopup="menu">⋮</button>
    </header>
    <section id="library" hidden>
      <div id="lib-scroll">
        <div class="page">
          <div class="eyebrow">MIRAGEGLASS</div>
          <div class="heading-row"><div><h1><span id="library-title"></span><span id="library-count" class="counter"></span></h1><p id="library-desc" class="heading-desc"></p></div></div>
          <div class="library-toolbar">
            <span id="toolbar-label"></span><div class="toolbar-spacer"></div>
            <div id="lib-zoom-controls" class="zoom-controls" data-i18n-label="libraryZoom"><button id="lib-zoom-out" data-i18n-label="zoomOut">−</button><button id="lib-zoom-reset" data-i18n-label="zoomReset"><span id="lib-zoom-level">100%</span></button><button id="lib-zoom-in" data-i18n-label="zoomIn">+</button></div>
            <select id="lib-sort" class="plain-select" data-i18n-label="sort"><option value="manual" data-i18n="manual"></option><option value="updated" data-i18n="updated"></option><option value="name" data-i18n="nameOrder"></option><option value="versions" data-i18n="versionsOrder"></option></select>
            <div class="segmented"><button id="layout-grid" aria-pressed="true" data-i18n-label="grid" data-icon="grid"></button><button id="layout-list" aria-pressed="false" data-i18n-label="list" data-icon="list"></button></div>
          </div>
          <div class="batch-bar" id="batch-bar">
            <button class="button" id="selection-toggle" data-i18n="multiSelect" aria-pressed="false"></button>
            <button class="button" id="select-all" data-i18n="selectAll" hidden></button>
            <strong id="selection-count" hidden></strong>
            <button class="button subtle" id="selection-clear" data-i18n="clearSelection" hidden></button>
            <div class="batch-spacer"></div>
            <select id="move-target" class="plain-select" data-i18n-label="moveTarget" hidden></select>
            <button class="button primary" id="bulk-move" data-i18n="moveSelected" hidden></button>
          </div>
          <p class="batch-hint" data-i18n="dragHint"></p>
          <div id="lib-groups" class="deck-grid" aria-live="polite"></div>
          <div id="library-pager" hidden><span id="pager-message"></span><button class="button" id="load-more" data-i18n="more"></button></div>
        </div>
      </div>
    </section>
    <section id="app" hidden>
      <header id="bar" class="viewer-main-head">
        <div class="viewer-crumb"><button id="to-library" data-i18n="library"></button><span>›</span><span id="viewer-group"></span></div>
        <div class="viewer-title-row"><div class="viewer-title-block"><h1 class="title"></h1><span id="active-tag" class="active-tag"></span><span id="viewing-tag" class="viewing-tag" hidden></span></div>
          <div class="viewer-actions"><button id="copy" class="button"><span data-icon="copy"></span><span data-i18n="copyLink"></span></button><div id="mode-switch" class="segmented"><button data-mode="single" aria-pressed="true" data-i18n="single"></button><button data-mode="compare" aria-pressed="false" data-i18n="compare"></button></div><button id="history-toggle" class="button primary" data-i18n="history" aria-pressed="true" aria-controls="version-section"></button><button id="viewer-more" class="button icon-only" data-i18n-label="moreActions" aria-haspopup="menu">⋮</button></div>
        </div>
      </header>
      <div class="viewer-workspace">
        <aside id="rail"><div class="rail-heading" data-i18n="groupDecks"></div><div id="deck-list"></div></aside>
        <div id="stage">
          <div class="preview-toolbar"><button id="rail-toggle" class="button icon-only subtle" aria-expanded="true" aria-controls="rail" data-i18n-label="hideDecks" data-icon="menu"></button><span id="screen-label"></span><div class="toolbar-spacer"></div><div id="zoom-controls" class="zoom-controls" data-i18n-label="viewerZoom"><button id="zoom-out" data-i18n-label="zoomOut">−</button><span id="zoom-level">100%</span><button id="zoom-in" data-i18n-label="zoomIn">+</button><button id="zoom-reset" data-i18n-label="zoomReset" data-icon="reset"></button></div><button id="download-version" class="button icon-only subtle" data-i18n-label="download" data-icon="download"></button><button id="fullscreen" class="button icon-only subtle" data-i18n-label="fullScreen" data-icon="expand"></button></div>
          <div id="compare-controls" hidden><label><span data-i18n="versionA"></span><select id="version-a" data-i18n-label="versionA"></select></label><button id="swap" class="button icon-only" data-i18n-label="swap">⇄</button><label><span data-i18n="versionB"></span><select id="version-b" data-i18n-label="versionB"></select></label></div>
          <div id="viewer">
            <section class="pane" id="pane-a"><div class="pane-label" id="label-a"></div><div class="frame-wrap"><iframe id="frame-a" title="Deck preview"></iframe><p class="frame-message" id="message-a" hidden></p></div></section>
            <section class="pane" id="pane-b"><div class="pane-label" id="label-b"></div><div class="frame-wrap"><iframe id="frame-b" title="Deck comparison"></iframe><p class="frame-message" id="message-b" hidden></p></div></section>
          </div>
        </div>
        <aside id="version-section"><div class="history-head"><strong id="version-heading" data-i18n="history"></strong><span id="history-count"></span></div><div id="scope-switch" class="segmented" data-i18n-label="versionScope" hidden><button data-scope="deck" aria-pressed="true" data-i18n="scopeDeck"></button><button data-scope="screen" aria-pressed="false" data-i18n="scopeScreen"></button></div><div id="version-list"></div></aside>
      </div>
    </section>
  </main>
</div>
<div id="dialog-overlay" hidden><div id="dialog-box" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div id="dialog-head"><h2 id="dialog-title"></h2><button id="dialog-x" data-i18n-label="close">×</button></div><div id="dialog-body"></div><div id="dialog-foot"><button id="dialog-cancel" class="button" data-i18n="cancel"></button><button id="dialog-confirm" class="button primary" data-i18n="ok"></button></div></div></div>
<div id="lib-live" class="visually-hidden" aria-live="polite"></div>
<div id="toast" role="status"></div>
<noscript>Enable JavaScript to use MirageGlass.</noscript>
</body>
</html>
