<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MirageGlass</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: system-ui, "Segoe UI", sans-serif; color: #202124; }
  button, select, input { font: inherit; }
  #app { --rail-w: 260px; display: flex; height: 100%; background: #f4f5f7; }
  #app[hidden] { display: none; }
  #rail { width: var(--rail-w); flex: none; border-right: 1px solid #dfe1e5; display: flex; flex-direction: column;
          background: #fafafb; transition: width 160ms ease; }
  #app.rail-hidden #rail { width: 0; border-right: 0; overflow: hidden; }
  #deck-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .rail-heading { position: sticky; top: 0; z-index: 1; padding: 10px 12px; border-bottom: 1px solid #e8eaed;
                  background: rgba(250, 250, 251, .96); color: #6f7278; font-size: 11px; font-weight: 700;
                  letter-spacing: 0; text-transform: uppercase; }
  .deck-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #ededf0; }
  .deck-item:hover { background: #f1f4fa; }
  .deck-item.active { background: #e8f0fe; box-shadow: inset 3px 0 #1a73e8; }
  .thumb { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top;
           border: 1px solid #dcdce0; border-radius: 4px; background: #fff; display: block; }
  .card { width: 100%; aspect-ratio: 16 / 10; border: 1px solid #dcdce0; border-radius: 4px; background: #fff;
          display: flex; align-items: center; justify-content: center; color: #9a9aa2; font-size: 22px; }
  .name { margin-top: 6px; font-size: 12px; font-weight: 600; line-height: 1.35; word-break: break-all; }
  .date { margin-top: 2px; font-size: 11px; color: #8a8a92; }
  .screen-tree { padding: 2px 0 6px; background: #eef1f6; border-bottom: 1px solid #ededf0; }
  .screen-item { padding: 7px 10px 7px 26px; font-size: 12px; color: #45484d; cursor: pointer; border-left: 3px solid transparent; }
  .screen-item:hover { background: #e3e7f0; }
  .screen-item.active { background: #e8f0fe; color: #174ea6; font-weight: 650; border-left-color: #1a73e8; }
  #version-section[hidden] { display: none; }
  #version-section { border-top: 1px solid #dfe1e5; flex: none; max-height: 42%; min-height: 160px;
                     display: flex; flex-direction: column; overflow: hidden; }
  #version-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .version-card { margin: 8px 10px; padding: 9px; border: 1px solid #dfe1e5; border-radius: 6px; background: #fff; }
  .version-card.selectable { cursor: pointer; }
  .version-card.selectable:hover { border-color: #c6d6f5; background: #f6f9ff; }
  .version-card.viewing { border-color: #1a73e8; background: #f0f6ff; box-shadow: inset 3px 0 #1a73e8; }
  .version-card:focus-visible { outline: 2px solid #1a73e8; outline-offset: 1px; }
  .version-line { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .version-number { font-size: 12px; font-weight: 700; }
  .version-position { margin-left: auto; color: #858890; font-size: 10px; }
  .version-meta { margin-top: 5px; color: #777b82; font-size: 10px; line-height: 1.35; overflow-wrap: anywhere; }
  .badge { display: inline-flex; align-items: center; min-height: 17px; padding: 1px 5px; border-radius: 999px;
           background: #eef0f3; color: #64676d; font-size: 9px; font-weight: 700; text-transform: uppercase; }
  .badge.active { background: #d9f2e3; color: #137333; }
  .badge.latest { background: #e8f0fe; color: #1967d2; }
  .badge.count { text-transform: none; letter-spacing: .2px; }
  .deck-versions { margin-top: 5px; }
  .status-ready { color: #137333; }
  .status-failed { color: #b3261e; }
  .set-active-btn { display: block; margin-top: 6px; padding: 3px 8px; font-size: 10px; font-weight: 650;
                     border: 1px solid #1a73e8; border-radius: 4px; background: #fff; color: #1a73e8; cursor: pointer; }
  .set-active-btn:hover { background: #e8f0fe; }
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #bar { min-height: 48px; flex: none; display: flex; align-items: center; gap: 10px; padding: 7px 12px;
         border-bottom: 1px solid #dfe1e5; background: #fff; font-size: 13px; }
  #bar .title { min-width: 0; overflow: hidden; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
  .viewing-tag { flex: none; padding: 2px 8px; border-radius: 999px; background: #fef7e0; color: #9a6700;
                 font-size: 11px; font-weight: 700; white-space: nowrap; }
  #bar button { padding: 5px 9px; border: 1px solid #c7c9cd; border-radius: 5px; background: #fff; color: #3c4043; cursor: pointer; font-size: 12px; }
  #bar button:hover { background: #f5f6f7; }
  #bar button:disabled { opacity: .5; cursor: not-allowed; }
  #bar .icon-action { width: 34px; height: 30px; padding: 5px; display: inline-flex; align-items: center; justify-content: center; }
  #bar .icon-action svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #bar .icon-action.uploading::after { content: '…'; font-size: 18px; line-height: 1; }
  #bar .icon-action.uploading svg { display: none; }
  #rail-toggle { width: 34px; flex: none; line-height: 1.2; }
  #to-library { flex: none; white-space: nowrap; }
  #mode-switch, #scope-switch { display: flex; }
  #mode-switch { margin-left: auto; }
  #mode-switch button, #scope-switch button { border-radius: 0; }
  #mode-switch button:first-child, #scope-switch button:first-child { border-radius: 5px 0 0 5px; }
  #mode-switch button:last-child, #scope-switch button:last-child { margin-left: -1px; border-radius: 0 5px 5px 0; }
  #mode-switch button[aria-pressed="true"], #scope-switch button[aria-pressed="true"] { position: relative; border-color: #1a73e8; background: #e8f0fe; color: #174ea6; }
  #copy[hidden], #upload-version[hidden], #download-version[hidden], #mode-switch[hidden], #scope-switch[hidden], #compare-controls[hidden], #viewing-tag[hidden], #zoom-controls[hidden] { display: none; }
  #zoom-controls, #lib-zoom-controls { flex: none; display: flex; align-items: center; gap: 4px; }
  #lib-zoom-controls { margin-left: auto; }
  #zoom-controls button, #lib-zoom-controls button {
    width: 26px; padding: 5px 0; font-size: 13px; font-weight: 700; line-height: 1;
    border: 1px solid #c7c9cd; border-radius: 5px; background: #fff; color: #3c4043; cursor: pointer;
  }
  #zoom-controls button:hover, #lib-zoom-controls button:hover { background: #f5f6f7; }
  #zoom-controls button:disabled, #lib-zoom-controls button:disabled { opacity: .4; cursor: not-allowed; }
  #zoom-level, #lib-zoom-level { min-width: 40px; text-align: center; font-size: 12px; font-weight: 650; color: #3c4043; }
  #compare-controls { min-height: 48px; flex: none; display: flex; align-items: center; justify-content: center; gap: 10px;
                      padding: 7px 12px; border-bottom: 1px solid #dfe1e5; background: #fafafb; font-size: 12px; }
  #compare-controls label { display: flex; align-items: center; gap: 6px; font-weight: 650; }
  #compare-controls select { min-width: 108px; padding: 5px 24px 5px 7px; border: 1px solid #bdc1c6; border-radius: 5px; background: #fff; }
  #swap { padding: 5px 8px; border: 1px solid #bdc1c6; border-radius: 5px; background: #fff; cursor: pointer; }
  #viewer { flex: 1; display: flex; min-height: 0; gap: 1px; background: #c8cbd0; }
  .pane { position: relative; flex: 1 1 50%; min-width: 0; display: flex; flex-direction: column; background: #fff; overflow: auto; }
  .pane-label { display: none; min-height: 30px; flex: none; align-items: center; justify-content: center;
                border-bottom: 1px solid #e3e5e8; background: #f8f9fa; color: #656970; font-size: 11px; font-weight: 700; }
  #viewer.compare .pane-label { display: flex; }
  #viewer:not(.compare) #pane-b { display: none; }
  iframe { flex: 1; width: 100%; min-height: 0; border: 0; background: #fff; }
  .empty { padding: 24px; color: #8a8a92; font-size: 12px; }

  /* --- Library/Home ------------------------------------------------------ */
  #library { height: 100%; display: flex; flex-direction: column; background: #f4f5f7; }
  #library[hidden] { display: none; }
  #lib-bar { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px;
             border-bottom: 1px solid #dfe1e5; background: #fff; }
  #lib-bar .lib-title { flex: none; font-weight: 700; font-size: 15px; }
  #lib-search { flex: 1; max-width: 360px; padding: 6px 10px; border: 1px solid #c7c9cd; border-radius: 5px; font-size: 13px; }
  #lib-upload, #lib-new-group { flex: none; padding: 6px 12px; border: 1px solid #1a73e8; border-radius: 5px;
                                cursor: pointer; font-size: 13px; font-weight: 650; }
  #lib-upload { display: inline-flex; align-items: center; gap: 6px; background: #fff; color: #1a73e8; }
  #lib-upload svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #lib-upload:hover { background: #e8f0fe; }
  #lib-upload:disabled { opacity: .5; cursor: not-allowed; }
  #lib-new-group { background: #1a73e8; color: #fff; }
  #lib-new-group:hover { background: #1765cc; }
  #lib-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 40px; }
  .lib-shelf { margin-bottom: 18px; }
  .lib-shelf[hidden] { display: none; }
  .lib-shelf h2 { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .2px;
                  text-transform: uppercase; color: #6f7278; }
  .lib-cards { display: flex; flex-wrap: wrap; gap: 12px; }
  .lib-group { position: relative; margin-bottom: 18px; }
  .lib-group-header { display: flex; align-items: center; gap: 6px; padding: 4px; border-radius: 5px; }
  .lib-group-toggle { border: 0; background: none; cursor: pointer; font-size: 12px; width: 20px; color: #45484d; }
  .lib-group-toggle .arrow { display: inline-block; transition: transform 120ms ease; }
  .lib-group.collapsed .lib-group-toggle .arrow { transform: rotate(-90deg); }
  .lib-group-name { font-weight: 700; font-size: 13px; }
  .lib-group-kebab { margin-left: auto; border: 0; background: none; cursor: pointer; font-size: 16px;
                      padding: 2px 8px; border-radius: 4px; color: #5f6368; }
  .lib-group-kebab:hover { background: #e8eaed; }
  .lib-group-cards { display: flex; flex-wrap: wrap; gap: 12px; padding: 8px 0 8px 20px; }
  .lib-group.collapsed .lib-group-cards { display: none; }
  .lib-card { position: relative; width: 190px; border: 1px solid #dcdce0; border-radius: 6px; background: #fff;
              padding: 8px; cursor: pointer; }
  .lib-card:hover { border-color: #b9c6e6; box-shadow: 0 1px 4px rgba(26,115,232,.15); }
  .lib-card-thumb { width: 100%; aspect-ratio: 16 / 10; border: 1px solid #dcdce0; border-radius: 4px;
                     background: #fff; overflow: hidden; display: flex; align-items: center; justify-content: center;
                     color: #9a9aa2; font-size: 20px; }
  .lib-card-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .lib-card-name { margin-top: 6px; font-size: 12px; font-weight: 650; line-height: 1.35; word-break: break-all;
                    padding-right: 18px; }
  .lib-card-meta { margin-top: 2px; font-size: 11px; color: #8a8a92; }
  .lib-pin { position: absolute; top: 6px; right: 30px; border: 0; background: none; cursor: pointer;
             font-size: 15px; color: #9a9aa2; padding: 2px 4px; line-height: 1; }
  .lib-pin.pinned { color: #f9ab00; }
  .lib-kebab { position: absolute; top: 6px; right: 6px; border: 0; background: none; cursor: pointer;
               font-size: 16px; color: #5f6368; padding: 2px 6px; border-radius: 4px; }
  .lib-kebab:hover, .lib-pin:hover { background: #eef1f6; }
  .lib-empty { padding: 20px 4px; color: #8a8a92; font-size: 12px; }
  .lib-card[data-organizable="true"], .lib-group-drag-handle { cursor: grab; }
  .lib-card.drag-source, .lib-group.drag-source { opacity: .48; }
  .lib-card.drop-before { box-shadow: -4px 0 #1a73e8; }
  .lib-card.drop-after { box-shadow: 4px 0 #1a73e8; }
  .lib-group.drop-before::before, .lib-group.drop-after::after {
    content: ''; position: absolute; left: 0; right: 0; height: 3px; border-radius: 2px; background: #1a73e8;
  }
  .lib-group.drop-before::before { top: -7px; }
  .lib-group.drop-after::after { bottom: -7px; }
  .lib-group-header.deck-drop-target, .lib-group-cards.deck-drop-target {
    background: #e8f0fe; outline: 2px solid #1a73e8; outline-offset: -2px;
  }
  #library.dragging, #library.dragging * { cursor: grabbing !important; }
  .visually-hidden { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
                     overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

  .lib-menu { position: fixed; z-index: 40; min-width: 172px; max-width: calc(100vw - 16px); background: #fff; border: 1px solid #dcdce0;
              border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.16); padding: 4px; }
  .lib-menu-item { display: block; width: 100%; text-align: left; padding: 7px 10px; border: 0; background: none;
                    cursor: pointer; font-size: 12px; border-radius: 4px; color: #202124; }
  .lib-menu-item:hover { background: #f1f4fa; }
  .lib-menu-item:disabled { color: #9a9aa2; cursor: default; }
  .lib-menu-item:disabled:hover { background: none; }
  .lib-menu-item.destructive { color: #b3261e; }
  .lib-menu-item.submenu-parent::after { content: '\203A'; float: right; color: #9a9aa2; }
  .lib-menu-sep { height: 1px; margin: 4px 2px; background: #e8eaed; }

  /* --- Custom dialog (backdrop/outside click/Esc never close it) --------- */
  #dialog-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(32,33,36,.55);
                     display: flex; align-items: center; justify-content: center; padding: 20px; }
  #dialog-overlay[hidden] { display: none; }
  #dialog-box { width: 100%; max-width: 520px; background: #fff; border-radius: 8px;
                box-shadow: 0 10px 40px rgba(0,0,0,.25); display: flex; flex-direction: column; max-height: 90vh; }
  #dialog-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #e8eaed; }
  #dialog-title { margin: 0; font-size: 15px; font-weight: 700; flex: 1; }
  #dialog-x { flex: none; border: 0; background: none; font-size: 18px; line-height: 1; cursor: pointer;
              color: #5f6368; padding: 2px 6px; border-radius: 4px; }
  #dialog-x:hover { background: #f1f3f4; }
  #dialog-body { padding: 16px; font-size: 13px; color: #3c4043; overflow-y: auto; line-height: 1.5; }
  #dialog-body p { margin: 0 0 8px; }
  #dialog-body p:last-child { margin-bottom: 0; }
  .dialog-field { display: block; font-size: 12px; font-weight: 650; color: #45484d; }
  .dialog-field input, .dialog-field select { display: block; width: 100%; min-width: 0; margin-top: 6px; padding: 7px 9px;
                         border: 1px solid #c7c9cd; border-radius: 5px; font-size: 13px; color: #202124; background: #fff; }
  .dialog-field + .dialog-field { margin-top: 12px; }
  .upload-dropzone { min-height: 170px; margin-top: 12px; padding: 24px; border: 2px dashed #aeb4bc; border-radius: 8px;
                     display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
                     background: #f8f9fa; color: #5f6368; text-align: center; cursor: pointer; transition: 120ms ease; }
  .upload-dropzone:hover, .upload-dropzone:focus-visible, .upload-dropzone.drag-over {
    border-color: #1a73e8; background: #e8f0fe; color: #174ea6; outline: none;
  }
  .upload-dropzone svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .upload-dropzone strong { color: #202124; font-size: 14px; }
  .upload-dropzone small { font-size: 11px; }
  .upload-file-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; color: #174ea6; }
  .upload-file-input { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
  #dialog-foot { flex: none; display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px;
                 border-top: 1px solid #e8eaed; }
  #dialog-foot button { padding: 7px 14px; border-radius: 5px; font-size: 13px; cursor: pointer; }
  #dialog-cancel[hidden] { display: none; }
  #dialog-cancel { border: 1px solid #c7c9cd; background: #fff; color: #3c4043; }
  #dialog-cancel:hover { background: #f5f6f7; }
  #dialog-confirm { border: 1px solid #1a73e8; background: #1a73e8; color: #fff; font-weight: 650; }
  #dialog-confirm:hover { background: #1765cc; }
  #dialog-confirm.destructive { border-color: #b3261e; background: #b3261e; }
  #dialog-confirm.destructive:hover { background: #932016; }
  #dialog-confirm:disabled { opacity: .5; cursor: not-allowed; }

  @media (max-width: 760px) {
    #app { --rail-w: 210px; }
    #bar { gap: 6px; }
    #copy { display: none; }
    #compare-controls { justify-content: flex-start; overflow-x: auto; }
    #lib-bar { gap: 8px; padding: 8px; flex-wrap: wrap; }
    #lib-search { min-width: 0; }
    #lib-scroll { padding-left: 8px; padding-right: 8px; }
    .lib-group-cards { padding-left: 8px; gap: 8px; }
    .lib-card { width: calc(50% - 4px); min-width: 0; }
    #dialog-overlay { padding: 8px; }
  }
  @media (max-width: 390px) {
    #lib-bar .lib-title { width: 100%; }
    #lib-search { max-width: none; }
    #lib-new-group { padding-left: 9px; padding-right: 9px; }
  }
</style>
</head>
<body>
<div id="app" hidden>
  <aside id="rail">
    <div class="rail-heading">Decks</div>
    <div id="deck-list"><div class="empty">Loading...</div></div>
    <section id="version-section" hidden>
      <div class="rail-heading" id="version-heading">Version history</div>
      <div id="version-list"></div>
    </section>
  </aside>
  <main id="stage">
    <div id="bar">
      <button id="rail-toggle" aria-expanded="true" aria-controls="rail" aria-label="Toggle deck list" title="Hide deck list">&#9776;</button>
      <button id="to-library" type="button">&larr; Library</button>
      <span class="title">MirageGlass</span>
      <span id="viewing-tag" class="viewing-tag" hidden></span>
      <div id="scope-switch" hidden aria-label="Version scope">
        <button type="button" data-scope="deck" aria-pressed="true">Deck</button>
        <button type="button" data-scope="screen" aria-pressed="false">Screen</button>
      </div>
      <div id="mode-switch" hidden aria-label="Viewer mode">
        <button type="button" data-mode="single" aria-pressed="true">Active</button>
        <button type="button" data-mode="compare" aria-pressed="false">Compare</button>
      </div>
      <div id="zoom-controls" hidden aria-label="Deck zoom">
        <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
        <span id="zoom-level">100%</span>
        <button id="zoom-in" type="button" aria-label="Zoom in">&plus;</button>
      </div>
      <button id="upload-version" class="icon-action" type="button" hidden aria-label="Upload new version" title="Upload new version" data-idle-label="Upload new version">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7.5 8.5 12 4l4.5 4.5M5 15v4h14v-4"/></svg>
      </button>
      <button id="download-version" class="icon-action" type="button" hidden aria-label="Download ZIP" title="Download ZIP">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12m-4.5-4.5L12 16l4.5-4.5M5 19h14"/></svg>
      </button>
      <button id="copy" type="button" hidden>Copy link</button>
    </div>
    <div id="compare-controls" hidden>
      <label>Version A <select id="version-a" aria-label="Version A"></select></label>
      <button id="swap" type="button" title="Swap compared versions" aria-label="Swap compared versions">&#8646;</button>
      <label>Version B <select id="version-b" aria-label="Version B"></select></label>
    </div>
    <div id="viewer">
      <section class="pane" id="pane-a">
        <div class="pane-label" id="label-a">Version A</div>
        <iframe id="frame-a" title="Deck"></iframe>
      </section>
      <section class="pane" id="pane-b">
        <div class="pane-label" id="label-b">Version B</div>
        <iframe id="frame-b" title="Deck comparison"></iframe>
      </section>
    </div>
  </main>
</div>
<div id="library" hidden>
  <header id="lib-bar">
    <span class="lib-title">MirageGlass</span>
    <input id="lib-search" type="search" placeholder="Search decks and groups" aria-label="Search decks and groups" />
    <button id="lib-upload" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7.5 8.5 12 4l4.5 4.5M5 15v4h14v-4"/></svg>
      <span>Upload deck</span>
    </button>
    <button id="lib-new-group" type="button">New group</button>
    <div id="lib-zoom-controls" aria-label="Library zoom">
      <button id="lib-zoom-out" type="button" aria-label="Zoom out">&minus;</button>
      <span id="lib-zoom-level">100%</span>
      <button id="lib-zoom-in" type="button" aria-label="Zoom in">&plus;</button>
    </div>
  </header>
  <div id="lib-scroll">
    <section id="lib-pinned-row" class="lib-shelf" hidden>
      <h2>Pinned</h2>
      <div class="lib-cards"></div>
    </section>
    <section id="lib-recent-row" class="lib-shelf" hidden>
      <h2>Recent</h2>
      <div class="lib-cards"></div>
    </section>
    <div id="lib-groups"><div class="lib-empty">Loading...</div></div>
  </div>
  <div id="lib-live" class="visually-hidden" aria-live="polite"></div>
</div>
<div id="dialog-overlay" hidden>
  <div id="dialog-box" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div id="dialog-head">
      <h2 id="dialog-title"></h2>
      <button id="dialog-x" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="dialog-body"></div>
    <div id="dialog-foot">
      <button id="dialog-cancel" type="button">Cancel</button>
      <button id="dialog-confirm" type="button">OK</button>
    </div>
  </div>
</div>
<script>
// The stable active viewer and the read-only version comparison view share this page.
// The single ("Active") pane also lets the reader open any past ready version from the
// version-history rail; doing so never moves the deck's active pointer (compare is
// untouched by this). viewingVersion tracks which version that single pane is showing.
// A deck with more than one screen (registered with a screens.json manifest) adds a
// rail tree of screens plus a Deck/Screen scope switch: Deck keeps today's deck-wide
// timeline, Screen narrows the version panel to just the selected screen's own change
// history (derived server-side, so two screens can show different counts).
//
// Root routing: an empty location.hash renders Library/Home; a hash with a deck id
// opens that deck's Viewer directly (bookmark-compatible). The two screens are mutually
// exclusive siblings toggled through their `hidden` attribute - see showLibraryScreen()
// and showViewerScreen(). Management UI (new group, kebab menus, delete, set active) is
// always visible from first load; the server alone decides whether a write is allowed
// (D0007 3.6). No admin-mode entry button, token prompt, or session-storage toggle exists
// in this file on purpose.
let decks = [];
let decksLoaded = false;
let decksLoadFailed = false;
let currentId = null;
// T0014 4 / T0016 4: null means "no scope resolved yet" (before the first
// loadRailScope() call, e.g. on the Library screen) and falls back to showing
// every deck. Once resolved it is never null again - it holds the current
// deck's Library group (or Ungrouped) in that group's own server order, or just
// [deckId] when the lookup fails or the deck isn't found in the listing
// (fail-closed, never every deck).
let railScopeIds = null;
let screens = [];
let currentScreenKey = null;
let scope = 'deck';
let versionData = null;
let mode = 'single';
let versionA = null;
let versionB = null;
let viewingVersion = null;
let uploadInFlight = false;
const initialMode = new URLSearchParams(location.search).get('mode');

// T0014 3: zoom applies only to the deck content panes (frame-a, and frame-b in
// compare mode) - never to the MirageGlass header, deck rail, or version history.
// CSS `zoom` reflows just the iframe's own box; `.pane` (see #viewer CSS) scrolls
// the overflow, so surrounding flex layout never changes size regardless of the
// current factor. The percent is in-memory JS state only: it starts at 100 on
// every fresh page load and is deliberately left untouched by deck/version/screen/
// mode switches, which only ever reassign iframe.src - so the chosen zoom survives
// those switches for free. 50%-200% in 10% steps was picked as a usable range: it
// stays readable at both ends without letting a stray click blow up the layout.
const ZOOM_MIN_PERCENT = 50;
const ZOOM_MAX_PERCENT = 200;
const ZOOM_STEP_PERCENT = 10;
let zoomPercent = 100;

function applyZoom() {
  const factor = String(zoomPercent / 100);
  ['frame-a', 'frame-b'].forEach(id => {
    const frame = document.getElementById(id);
    if (frame) frame.style.zoom = factor;
  });
  const level = document.getElementById('zoom-level');
  if (level) level.textContent = zoomPercent + '%';
  document.getElementById('zoom-out').disabled = zoomPercent <= ZOOM_MIN_PERCENT;
  document.getElementById('zoom-in').disabled = zoomPercent >= ZOOM_MAX_PERCENT;
}

document.getElementById('zoom-out').onclick = () => {
  zoomPercent = Math.max(ZOOM_MIN_PERCENT, zoomPercent - ZOOM_STEP_PERCENT);
  applyZoom();
};

document.getElementById('zoom-in').onclick = () => {
  zoomPercent = Math.min(ZOOM_MAX_PERCENT, zoomPercent + ZOOM_STEP_PERCENT);
  applyZoom();
};

applyZoom();

// T0016 1: Library zoom is independent from Viewer zoom (separate in-memory
// state, starts at 100% on every fresh load) and only ever scales the dashboard
// content column (#lib-scroll: Pinned/Recent, group headers, deck cards,
// Ungrouped) - never the header/search bar above it or the menu/dialog overlays,
// which sit outside #lib-scroll in the DOM and are unaffected by its zoom. CSS
// `zoom` (not `transform`) keeps DnD hit-testing, getBoundingClientRect() and
// click/drag coordinates correct at any factor, for the same reason as the
// Viewer zoom above.
const LIB_ZOOM_MIN_PERCENT = 50;
const LIB_ZOOM_MAX_PERCENT = 200;
const LIB_ZOOM_STEP_PERCENT = 10;
let libZoomPercent = 100;

function applyLibZoom() {
  document.getElementById('lib-scroll').style.zoom = String(libZoomPercent / 100);
  document.getElementById('lib-zoom-level').textContent = libZoomPercent + '%';
  document.getElementById('lib-zoom-out').disabled = libZoomPercent <= LIB_ZOOM_MIN_PERCENT;
  document.getElementById('lib-zoom-in').disabled = libZoomPercent >= LIB_ZOOM_MAX_PERCENT;
}

document.getElementById('lib-zoom-out').onclick = () => {
  libZoomPercent = Math.max(LIB_ZOOM_MIN_PERCENT, libZoomPercent - LIB_ZOOM_STEP_PERCENT);
  applyLibZoom();
};

document.getElementById('lib-zoom-in').onclick = () => {
  libZoomPercent = Math.min(LIB_ZOOM_MAX_PERCENT, libZoomPercent + LIB_ZOOM_STEP_PERCENT);
  applyLibZoom();
};

applyLibZoom();

function applyRail(hidden) {
  document.getElementById('app').classList.toggle('rail-hidden', hidden);
  const toggle = document.getElementById('rail-toggle');
  toggle.setAttribute('aria-expanded', String(!hidden));
  toggle.title = hidden ? 'Show deck list' : 'Hide deck list';
}

let railHidden = false;
try {
  railHidden = localStorage.getItem('mg.rail.hidden') === 'true';
} catch (error) {
  // Keep the default expanded state when storage is unavailable.
}
applyRail(railHidden);

document.getElementById('rail-toggle').onclick = () => {
  const hidden = !document.getElementById('app').classList.contains('rail-hidden');
  applyRail(hidden);
  try {
    localStorage.setItem('mg.rail.hidden', String(hidden));
  } catch (error) {
    // The current state still applies for this page session.
  }
};

// Deck/group names and API strings must be escaped before any innerHTML insertion.
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// The API returns UTC ISO8601 timestamps; the console always displays them in a
// fixed UTC+9 "YYYY-MM-DD HH:MM:SS" form, independent of the viewer's own locale
// or system timezone.
function formatTimestamp(iso) {
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return String(iso == null ? '' : iso);
  const shifted = new Date(date.getTime() + 9 * 60 * 60 * 1000);
  const pad = n => String(n).padStart(2, '0');
  return `${shifted.getUTCFullYear()}-${pad(shifted.getUTCMonth() + 1)}-${pad(shifted.getUTCDate())}`
    + ` ${pad(shifted.getUTCHours())}:${pad(shifted.getUTCMinutes())}:${pad(shifted.getUTCSeconds())}`;
}

// The rail only lists decks from the current deck's Library group (T0014 4,
// T0016 4); railScopeIds is kept in server-authoritative sync by loadRailScope()
// on every hash-driven deck open, and holds that group's/Ungrouped's own server
// order (not /api/v1/decks' registration order) so the rail mirrors whatever
// order Library itself renders. null only happens before the first
// loadRailScope() call (e.g. while on the Library screen) and falls back to the
// full unscoped listing; loadRailScope() itself never leaves it null again - a
// failed lookup or missing membership fails closed to [deckId] instead of ever
// widening back to every deck (T0016 4).
function visibleRailDecks() {
  if (!railScopeIds) return decks;
  const byId = new Map(decks.map(deck => [deck.id, deck]));
  return railScopeIds.map(id => byId.get(id)).filter(Boolean);
}

function versionedThumbUrl(deck) {
  // Bust thumbnails cached before the active version changed.
  return deck.thumb_url
    ? deck.thumb_url + '?v=' + encodeURIComponent(deck.active_version)
    : null;
}

function renderDecks() {
  const list = document.getElementById('deck-list');
  if (!decks.length) {
    list.innerHTML = decksLoadFailed
      ? '<div class="empty">Deck list is unavailable.</div>'
      : '<div class="empty">No decks registered yet.</div>';
    return;
  }
  const railDecks = visibleRailDecks();
  list.innerHTML = '';
  railDecks.forEach((deck, index) => {
    const item = document.createElement('div');
    item.className = 'deck-item' + (deck.id === currentId ? ' active' : '');
    item.dataset.deckId = deck.id;
    const preview = deck.thumb_url
      ? `<img class="thumb" src="${esc(versionedThumbUrl(deck))}" alt="">`
      : `<div class="card">${String(index + 1).padStart(2, '0')}</div>`;
    // A deck with more than one version advertises the count so the reader knows
    // history exists before selecting it (the badge sits on its own line to avoid
    // colliding with word-break: break-all names).
    const versionBadge = deck.latest_version > 1
      ? `<div class="deck-versions"><span class="badge count">${esc(deck.latest_version)} versions</span></div>`
      : '';
    item.innerHTML = preview
      + `<div class="name">${esc(deck.name)}</div>`
      + `<div class="date">${esc(formatTimestamp(deck.created_at))}</div>`
      + versionBadge;
    // T0016 2: location.hash is the single navigation owner - clicking a rail
    // item only ever writes the hash (openDeckFromHash()/selectDeck() do the
    // actual work via the resulting hashchange), so a rail click can never run
    // selectDeck() twice the way it used to when selectDeck() itself also wrote
    // location.hash.
    item.onclick = () => { location.hash = deck.id; };
    list.appendChild(item);

    // The screen tree nests directly under the selected deck, and only appears
    // once that deck actually declares more than one screen (screens.json).
    if (deck.id === currentId && screens.length > 1) {
      const tree = document.createElement('div');
      tree.className = 'screen-tree';
      screens.forEach(screen => {
        const row = document.createElement('div');
        row.className = 'screen-item' + (screen.key === currentScreenKey ? ' active' : '');
        row.textContent = screen.tag;
        row.onclick = event => {
          event.stopPropagation();
          selectScreen(screen.key);
        };
        tree.appendChild(row);
      });
      list.appendChild(tree);
    }
  });
}

function activeVersionNo() {
  return versionData ? versionData.active_version : null;
}

// Screen history labels are display-only. Every normalized item keeps its actual
// deck version number in item.version, which is the value downloads must use.
function selectedVersionNo() {
  return mode === 'compare' ? versionB : viewingVersion;
}

function updateViewerActions() {
  const selected = selectedVersionNo();
  const ready = versionData && versionData.items.some(
    item => item.version === selected && item.status === 'ready'
  );
  document.getElementById('download-version').disabled = !currentId || !ready;
  document.getElementById('upload-version').disabled = !currentId || uploadInFlight;
}

function setVersionHeading(text) {
  const heading = document.getElementById('version-heading');
  if (heading) heading.textContent = text;
}

function renderVersions(errorMessage) {
  const section = document.getElementById('version-section');
  const list = document.getElementById('version-list');
  section.hidden = !currentId;
  updateViewerActions();
  if (!currentId) return;
  if (errorMessage) {
    setVersionHeading('Version history');
    list.innerHTML = `<div class="empty">${esc(errorMessage)}</div>`;
    return;
  }
  if (!versionData) {
    setVersionHeading('Version history');
    list.innerHTML = '<div class="empty">Loading versions...</div>';
    return;
  }
  if (!versionData.items.length) {
    setVersionHeading('Version history');
    list.innerHTML = '<div class="empty">No versions found.</div>';
    return;
  }
  // The count signals at a glance how deep the history goes.
  setVersionHeading('Version history (' + versionData.items.length + ')');
  const active = activeVersionNo();
  const totalLabel = versionData.items.length;
  list.innerHTML = '';
  // Newest first: the API returns ascending version_no, but the reader expects the
  // latest version at the top of the rail. Only the display order is reversed here;
  // selection and comparison logic keep working from the original value-keyed data.
  [...versionData.items].reverse().forEach(item => {
    // Only ready versions can be opened, and only the single pane navigates
    // history - compare keeps its own dropdown-driven selection.
    const selectable = item.status === 'ready' && mode === 'single';
    const viewing = selectable && item.version === viewingVersion;
    // "Set active" (D0007 3.6/6.3) is a Deck-scope-only action, independent of the
    // single/compare toggle, and only makes sense on a ready, non-active version.
    const canActivate = item.status === 'ready' && scope === 'deck' && item.version !== active;
    const card = document.createElement('div');
    card.className = 'version-card'
      + (selectable ? ' selectable' : '')
      + (viewing ? ' viewing' : '');
    const activeBadge = item.version === active ? '<span class="badge active">Active</span>' : '';
    const latestBadge = item.version === versionData.latest_version ? '<span class="badge latest">Latest</span>' : '';
    // item.label is the number shown to the reader: the deck version_no in Deck
    // scope, or the screen's own relabeled 1..N count in Screen scope.
    card.innerHTML = `<div class="version-line"><span class="version-number">v${esc(item.label)}</span>${activeBadge}${latestBadge}
        <span class="version-position">${esc(item.label)} / ${esc(totalLabel)}</span></div>
      <div class="version-meta"><span class="status-${esc(item.status)}">${esc(item.status)}</span> - ${esc(formatTimestamp(item.created_at))}</div>`;
    if (selectable) {
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-pressed', String(viewing));
      card.onclick = () => viewVersion(item.version);
      card.onkeydown = event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          viewVersion(item.version);
        }
      };
    }
    if (canActivate) {
      const activateBtn = document.createElement('button');
      activateBtn.type = 'button';
      activateBtn.className = 'set-active-btn';
      activateBtn.textContent = 'Set active';
      activateBtn.onclick = event => {
        event.stopPropagation();
        setActiveVersion(currentId, item.version);
      };
      card.appendChild(activateBtn);
    }
    list.appendChild(card);
  });
}

function readyVersions() {
  return versionData ? versionData.items.filter(item => item.status === 'ready') : [];
}

// The current screen's /v/{id}/ sub-path ("" for the deck's root/"main" screen).
function screenPath() {
  const screen = screens.find(item => item.key === currentScreenKey);
  return screen ? screen.viewer_path : '';
}

function versionUrl(version) {
  return '/v/' + encodeURIComponent(currentId) + '/v' + encodeURIComponent(version) + '/' + screenPath();
}

// Every ready version, including the active one, uses its immutable version URL.
// The public /v/{id}/ URL remains stable for externally shared links.
function singleFrameUrl(version) {
  const deck = decks.find(item => item.id === currentId);
  if (version != null) return versionUrl(version);
  return deck ? deck.viewer_url + screenPath() : '';
}

function updateViewingTag() {
  const tag = document.getElementById('viewing-tag');
  const active = activeVersionNo();
  if (mode === 'single' && viewingVersion != null && viewingVersion !== active) {
    const item = versionData && versionData.items.find(entry => entry.version === viewingVersion);
    const label = item ? item.label : viewingVersion;
    tag.textContent = 'Viewing v' + label + ' (not active)';
    tag.hidden = false;
  } else {
    tag.hidden = true;
  }
}

function viewVersion(version) {
  // A history click is a single-pane action; return from compare first if needed.
  if (mode !== 'single') setMode('single');
  viewingVersion = version;
  document.getElementById('frame-a').src = singleFrameUrl(version);
  updateViewingTag();
  renderVersions();
}

function setCompareSources() {
  if (versionA == null || versionB == null) return;
  document.getElementById('frame-a').src = versionUrl(versionA);
  document.getElementById('frame-b').src = versionUrl(versionB);
  document.getElementById('label-a').textContent = 'Version A - v' + versionA;
  document.getElementById('label-b').textContent = 'Version B - v' + versionB;
}

function renderVersionControls() {
  const ready = readyVersions();
  const controls = document.getElementById('compare-controls');
  const selectA = document.getElementById('version-a');
  const selectB = document.getElementById('version-b');
  // Newest first in the dropdowns too, mirroring the rail order. Reversing a copy
  // leaves readyVersions() (and the selection logic that indexes it) untouched.
  const options = [...ready].reverse().map(item => {
    const suffix = item.is_active ? ' (active)' : '';
    return `<option value="${esc(item.version)}">v${esc(item.label)}${esc(suffix)}</option>`;
  }).join('');
  selectA.innerHTML = options;
  selectB.innerHTML = options;
  if (versionA != null) selectA.value = String(versionA);
  if (versionB != null) selectB.value = String(versionB);
  controls.hidden = mode !== 'compare' || !ready.length;
}

function setMode(nextMode) {
  mode = nextMode;
  document.querySelectorAll('#mode-switch button').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
  });
  document.getElementById('viewer').classList.toggle('compare', mode === 'compare');
  renderVersionControls();
  if (mode === 'compare') {
    setCompareSources();
  } else {
    // Switching to the single pane always returns to the deck's active version.
    const deck = decks.find(item => item.id === currentId);
    if (deck) {
      viewingVersion = activeVersionNo();
      document.getElementById('frame-a').src = singleFrameUrl(viewingVersion);
    }
  }
  renderVersions();
  updateViewingTag();
}

// Normalizes either the deck-wide /versions response or a screen-scoped
// /screens/{key}/versions response into the same {items, active_version,
// latest_version} shape the rest of the UI works with. In both cases item.version
// stays in deck-version space (so viewVersion/versionUrl need no branching); only
// item.label (the number shown to the reader) differs by scope.
async function fetchVersionData(id) {
  if (scope === 'screen' && currentScreenKey) {
    const response = await fetch(
      '/api/v1/decks/' + encodeURIComponent(id) + '/screens/'
        + encodeURIComponent(currentScreenKey) + '/versions',
      { cache: 'no-store' }
    );
    if (!response.ok) throw new Error('Version history is unavailable.');
    const data = await response.json();
    const items = (data.items || []).map(item => ({
      version: item.deck_version,
      label: item.version,
      status: 'ready',
      is_active: item.is_active,
      created_at: item.created_at,
    }));
    const activeItem = items.find(item => item.is_active);
    const latestItem = items[items.length - 1];
    return {
      items,
      active_version: activeItem ? activeItem.version : null,
      latest_version: latestItem ? latestItem.version : null,
    };
  }
  const response = await fetch('/api/v1/decks/' + encodeURIComponent(id) + '/versions', { cache: 'no-store' });
  if (!response.ok) throw new Error('Version history is unavailable.');
  const data = await response.json();
  const items = (data.items || []).map(item => ({ ...item, label: item.version }));
  return { items, active_version: data.active_version, latest_version: data.latest_version };
}

async function loadVersionData() {
  const id = currentId;
  versionData = null;
  renderVersions();
  try {
    const data = await fetchVersionData(id);
    if (currentId !== id) return;
    versionData = data;
    viewingVersion = versionData.active_version;
    const ready = readyVersions();
    if (ready.length) {
      const activeIndex = Math.max(0, ready.findIndex(item => item.is_active));
      versionB = ready[activeIndex].version;
      versionA = ready[Math.max(0, activeIndex - 1)].version;
    }
    if (mode === 'compare') {
      setCompareSources();
    } else {
      document.getElementById('frame-a').src = singleFrameUrl(viewingVersion);
    }
    renderVersions();
    updateViewingTag();
    renderVersionControls();
    // The version section has its own scroll now; make sure it (and the newest card
    // at its top) is in view on first load even if the deck list is very long.
    document.getElementById('version-section').scrollIntoView({ block: 'nearest' });
  } catch (error) {
    if (currentId === id) renderVersions(error.message || 'Version history is unavailable.');
  }
}

function setScope(nextScope) {
  if (scope === nextScope) return;
  scope = nextScope;
  document.querySelectorAll('#scope-switch button').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.scope === scope));
  });
  loadVersionData();
}

function selectScreen(key) {
  if (currentScreenKey === key) return;
  currentScreenKey = key;
  renderDecks();
  if (mode === 'compare') {
    setCompareSources();
  } else {
    document.getElementById('frame-a').src = singleFrameUrl(viewingVersion);
  }
  if (scope === 'screen') loadVersionData();
}

async function selectDeck(id) {
  const deck = decks.find(item => item.id === id);
  if (!deck) return;
  currentId = id;
  screens = [];
  currentScreenKey = null;
  scope = 'deck';
  versionData = null;
  versionA = null;
  versionB = null;
  viewingVersion = null;
  document.querySelector('#bar .title').textContent = deck.name;
  document.getElementById('copy').hidden = false;
  document.getElementById('upload-version').hidden = false;
  document.getElementById('download-version').hidden = false;
  document.getElementById('mode-switch').hidden = false;
  document.getElementById('zoom-controls').hidden = false;
  document.getElementById('scope-switch').hidden = true;
  document.querySelectorAll('#scope-switch button').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.scope === scope));
  });
  document.getElementById('frame-a').src = versionUrl(deck.active_version);
  document.getElementById('frame-b').removeAttribute('src');
  setMode('single');
  renderDecks();
  renderVersions();

  try {
    const response = await fetch('/api/v1/decks/' + encodeURIComponent(id) + '/screens', { cache: 'no-store' });
    if (response.ok && currentId === id) {
      const data = await response.json();
      screens = data.items || [];
      currentScreenKey = screens.length ? screens[0].key : null;
      document.getElementById('scope-switch').hidden = screens.length <= 1;
      renderDecks();
    }
  } catch (error) {
    // Multi-screen support is best-effort: the console still works as a
    // single-screen viewer when the screens endpoint is unavailable.
  }

  await loadVersionData();
  if (initialMode === 'compare') setMode('compare');
}

document.querySelectorAll('#mode-switch button').forEach(button => {
  button.onclick = () => setMode(button.dataset.mode);
});

document.querySelectorAll('#scope-switch button').forEach(button => {
  button.onclick = () => setScope(button.dataset.scope);
});

document.getElementById('version-a').onchange = event => {
  versionA = Number(event.target.value);
  setCompareSources();
  updateViewerActions();
};

document.getElementById('version-b').onchange = event => {
  versionB = Number(event.target.value);
  setCompareSources();
  updateViewerActions();
};

document.getElementById('swap').onclick = () => {
  const previousA = versionA;
  versionA = versionB;
  versionB = previousA;
  renderVersionControls();
  setCompareSources();
};

document.getElementById('copy').onclick = () => {
  navigator.clipboard.writeText(location.origin + '/v/' + currentId + '/' + screenPath());
};

document.getElementById('upload-version').onclick = uploadNewVersion;
document.getElementById('download-version').onclick = downloadSelectedVersion;

// --- Shared fetch helper for every Library/organization mutation -----------
// Normalizes the fixed error shape from D0007 3.6/T0010 0): {detail:{code,message}}
// on 401/404/422, or a legacy plain-string detail (older deck-delete route). Read
// endpoints and 204 responses just resolve with their body (or null).
// D0007 3.6 / T0014 1: the browser console session is a short-lived, HttpOnly,
// origin-bound cookie (see server/auth.py issue_console_session()). It can expire
// while Library stays open in the tab. A same-origin GET / is the only thing that
// reissues it (the same request the server already runs on first load), and it
// never exposes the operation token to JS. On a 401 this reissues the cookie and
// retries the original mutation exactly once - the _retried flag is the whole
// budget, so a mutation can recurse into this branch at most one extra time no
// matter how the response looks. Operation-token (Bearer) callers never reach this
// function at all: this file never sends an Authorization header (grep confirms),
// so every apiRequest() call is inherently a console-session request already.
async function reestablishConsoleSession() {
  try {
    // Force a network request, including for clients that still have an old
    // cached copy of / from before the server's no-store policy was introduced.
    const response = await fetch('/', { method: 'GET', credentials: 'same-origin', cache: 'no-store' });
    return response.ok;
  } catch (error) {
    // Same-origin GET / itself failed (offline, server down, ...). Do not retry
    // into more failure; let the original 401 surface through the normal path.
    return false;
  }
}

async function apiRequest(url, options, _retried) {
  const requestOptions = !options || !options.method || options.method.toUpperCase() === 'GET'
    ? { ...options, cache: 'no-store' }
    : options;
  const response = await fetch(url, requestOptions);
  if (response.ok) {
    if (response.status === 204) return null;
    return response.json();
  }
  if (response.status === 401 && !_retried) {
    const reestablished = await reestablishConsoleSession();
    if (reestablished) return apiRequest(url, options, true);
  }
  let detail = null;
  try {
    detail = (await response.json()).detail;
  } catch (error) {
    // No JSON body to read; fall through with a generic message below.
  }
  const code = detail && typeof detail === 'object' ? detail.code : null;
  const message = detail && typeof detail === 'object' ? detail.message
    : (typeof detail === 'string' ? detail : null);
  const error = new Error(message || ('Request failed (' + response.status + ')'));
  error.status = response.status;
  error.code = code;
  throw error;
}

function describeApiError(error) {
  if (error && error.code === 'unauthorized') return 'You do not have permission to make this change.';
  if (error && error.code === 'not_found') return 'This item no longer exists. The list has been refreshed.';
  if (error && error.code === 'invalid_name') return error.message || 'That name is not valid.';
  if (error && error.status) return error.message || ('The server rejected this request (' + error.status + ').');
  return 'Could not reach the server. Please try again.';
}

async function showFailureAlert(error, title) {
  await showAlert({
    title: title || 'Action failed',
    bodyHtml: `<p>${esc(describeApiError(error))}</p>`,
  });
}

async function setActiveVersion(deckId, versionNo) {
  try {
    const updated = await apiRequest(
      '/api/v1/decks/' + encodeURIComponent(deckId) + '/versions/' + encodeURIComponent(versionNo) + '/activate',
      { method: 'POST' }
    );
    const index = decks.findIndex(deck => deck.id === deckId);
    if (index !== -1) decks[index] = { ...decks[index], ...updated };
    renderDecks();

  } catch (error) {
