<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MirageGlass</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: system-ui, "Segoe UI", sans-serif; }
  #app { display: flex; height: 100%; }
  #rail { width: 232px; flex: none; border-right: 1px solid #e3e3e6; overflow-y: auto; background: #fafafb; }
  #rail .item { padding: 10px; cursor: pointer; border-bottom: 1px solid #ededf0; }
  #rail .item.active { background: #e8f0fe; }
  #rail .thumb { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top;
                 border: 1px solid #dcdce0; background: #fff; display: block; }
  #rail .card { width: 100%; aspect-ratio: 16 / 10; border: 1px solid #dcdce0; background: #fff;
                display: flex; align-items: center; justify-content: center; color: #9a9aa2; font-size: 22px; }
  #rail .name { margin-top: 6px; font-size: 12px; line-height: 1.35; word-break: break-all; }
  #rail .date { font-size: 11px; color: #8a8a92; }
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #bar { height: 40px; flex: none; display: flex; align-items: center; gap: 12px;
         padding: 0 12px; border-bottom: 1px solid #e3e3e6; font-size: 13px; }
  #bar .title { font-weight: 600; }
  #bar button { font-size: 12px; padding: 3px 8px; }
  #frame { flex: 1; border: 0; width: 100%; }
  .empty { padding: 24px; color: #8a8a92; }
</style>
</head>
<body>
<div id="app">
  <aside id="rail"><div class="empty">Loading…</div></aside>
  <main id="stage">
    <div id="bar"><span class="title">MirageGlass</span>
      <button id="copy" hidden>Copy link</button></div>
    <iframe id="frame" title="Deck"></iframe>
  </main>
</div>
<script>
// Left rail = list of uploaded decks (newest first). Clicking one loads it into the iframe on the right.
let decks = [];
let currentId = null;

// A deck name is a string chosen by the uploader. Never drop it into innerHTML as-is.
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function render() {
  const rail = document.getElementById('rail');
  if (!decks.length) { rail.innerHTML = '<div class="empty">No decks registered yet.</div>'; return; }
  rail.innerHTML = '';
  decks.forEach((deck, i) => {
    const item = document.createElement('div');
    item.className = 'item' + (deck.id === currentId ? ' active' : '');
    const preview = deck.thumb_url
      ? `<img class="thumb" src="${esc(deck.thumb_url)}" alt="">`     // capture succeeded
      : `<div class="card">${String(i + 1).padStart(2, '0')}</div>`;  // fallback numbered card on failure
    item.innerHTML = preview
      + `<div class="name">${esc(deck.name)}</div>`
      + `<div class="date">${esc(deck.created_at)}</div>`;
    item.onclick = () => select(deck.id);
    rail.appendChild(item);
  });
}

function select(id) {
  const deck = decks.find(d => d.id === id);
  if (!deck) return;
  currentId = id;
  document.getElementById('frame').src = deck.viewer_url;
  document.querySelector('#bar .title').textContent = deck.name;
  document.getElementById('copy').hidden = false;
  location.hash = id;
  render();
}

document.getElementById('copy').onclick = () => {
  navigator.clipboard.writeText(location.origin + '/v/' + currentId + '/');
};

fetch('/api/v1/decks').then(r => r.json()).then(data => {
  decks = data.items || [];
  render();
  const wanted = location.hash.slice(1);
  const first = decks.find(d => d.id === wanted) || decks[0];
  if (first) select(first.id);
});
</script>
</body>
</html>
