  }
}

// --- Custom dialog (D0007 6.4 / T0010 §3): name input, destructive confirm, --
// --- and failure alerts all funnel through this one overlay. It never closes --
// --- on backdrop click, outside click, or Esc - only the X, Cancel, or the ----
// --- confirm button resolve it. Kebab dropdown menus further below are a ------
// --- separate, lighter-weight component and intentionally do close on -------
// --- outside click / Esc, matching ordinary menu conventions. -----------------
const dialogEls = {
  overlay: document.getElementById('dialog-overlay'),
  box: document.getElementById('dialog-box'),
  title: document.getElementById('dialog-title'),
  body: document.getElementById('dialog-body'),
  cancelBtn: document.getElementById('dialog-cancel'),
  confirmBtn: document.getElementById('dialog-confirm'),
  closeBtn: document.getElementById('dialog-x'),
};

let activeDialog = null;

function dialogTrapKeydown(event) {
  if (event.key !== 'Tab') return;
  const focusables = Array.from(dialogEls.box.querySelectorAll('button, input, select'))
    .filter(el => !el.disabled && el.offsetParent !== null);
  if (!focusables.length) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
  // Esc is deliberately not handled here: the dialog only closes through an
  // explicit X / Cancel / Confirm click (D0007 6.4).
}

function closeDialog(result) {
  dialogEls.overlay.hidden = true;
  dialogEls.body.innerHTML = '';
  document.removeEventListener('keydown', dialogTrapKeydown, true);
  const pending = activeDialog;
  activeDialog = null;
  if (pending) pending.resolve(result);
}

function openGenericDialog(config) {
  const {
    title,
    bodyHtml,
    showCancel = true,
    cancelText = 'Cancel',
    confirmText = 'OK',
    destructive = false,
    focus = 'cancel',
  } = config;
  return new Promise(resolve => {
    activeDialog = { resolve };
    dialogEls.title.textContent = title;
    dialogEls.body.innerHTML = bodyHtml;
    dialogEls.cancelBtn.hidden = !showCancel;
    dialogEls.cancelBtn.textContent = cancelText;
    dialogEls.confirmBtn.textContent = confirmText;
    dialogEls.confirmBtn.disabled = false;
    dialogEls.confirmBtn.className = destructive ? 'destructive' : '';
    dialogEls.overlay.hidden = false;
    document.addEventListener('keydown', dialogTrapKeydown, true);

    const fields = Array.from(dialogEls.body.querySelectorAll('input, select'));
    if (fields.length) {
      const markedRequired = fields.filter(field => field.hasAttribute('data-dialog-required'));
      const requiredFields = markedRequired.length ? markedRequired : [fields[0]];
      const hasValue = field => field.type === 'file' ? Boolean(field.files && field.files.length)
        : Boolean(String(field.value || '').trim());
      const updateConfirmState = () => {
        dialogEls.confirmBtn.disabled = requiredFields.some(field => !hasValue(field));
      };
      fields.forEach(field => {
        field.addEventListener('input', updateConfirmState);
        field.addEventListener('change', updateConfirmState);
      });
      const textInput = fields.find(field => field.tagName === 'INPUT' && field.type !== 'file');
      if (textInput) {
        textInput.addEventListener('keydown', event => {
          if (event.key === 'Enter' && !dialogEls.confirmBtn.disabled) {
            event.preventDefault();
            dialogEls.confirmBtn.click();
          }
        });
      }
      updateConfirmState();
    }

    // Initial focus always lands on a reversible, non-destructive button
    // (never the input) - D0007 6.4 / T0010 §3.
    const focusTarget = focus === 'confirm' ? dialogEls.confirmBtn
      : (showCancel ? dialogEls.cancelBtn : dialogEls.confirmBtn);
    focusTarget.focus();
  });
}

dialogEls.closeBtn.onclick = () => closeDialog({ action: 'cancel' });
dialogEls.cancelBtn.onclick = () => closeDialog({ action: 'cancel' });
dialogEls.confirmBtn.onclick = () => {
  const input = dialogEls.body.querySelector('input');
  const values = {};
  dialogEls.body.querySelectorAll('[data-dialog-field]').forEach(field => {
    values[field.dataset.dialogField] = field.type === 'file'
      ? (field.files && field.files[0] ? field.files[0] : null)
      : field.value;
  });
  const primaryValue = input && input.type === 'file'
    ? (input.files && input.files[0] ? input.files[0] : null)
    : (input ? input.value.trim() : true);
  closeDialog({ action: 'confirm', value: primaryValue, values });
};
// The overlay backdrop intentionally has no click handler at all: a click there
// (or anywhere outside #dialog-box) does nothing, per D0007 6.4.

async function promptName({ title, label, initialValue = '' }) {
  const result = await openGenericDialog({
    title,
    bodyHtml: `<label class="dialog-field">${esc(label)}<input type="text" id="dialog-input" maxlength="200" value="${esc(initialValue)}"></label>`,
    confirmText: 'Save',
  });
  return result.action === 'confirm' ? result.value : null;
}

async function confirmDestructive({ title, bodyHtml, confirmText = 'Delete' }) {
  const result = await openGenericDialog({ title, bodyHtml, confirmText, destructive: true, focus: 'cancel' });
  return result.action === 'confirm';
}

async function showAlert({ title, bodyHtml }) {
  await openGenericDialog({ title, bodyHtml, showCancel: false, confirmText: 'OK', focus: 'confirm' });
}

function uploadIdempotencyKey(kind) {
  const nonce = globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function'
    ? globalThis.crypto.randomUUID()
    : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
  return 'console-' + kind + '-' + nonce;
}

async function promptZipUpload({ title, includeName = false }) {
  const nameField = includeName
    ? '<label class="dialog-field">Deck name<input type="text" maxlength="120" data-dialog-field="name" data-dialog-required></label>'
    : '';
  const resultPromise = openGenericDialog({
    title,
    bodyHtml: nameField
      + '<label class="upload-dropzone" tabindex="0">'
      + '<input class="upload-file-input" type="file" accept=".zip,application/zip,application/x-zip-compressed" data-dialog-field="file" data-dialog-required>'
      + '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m-4 4 4-4 4 4M5 14v5h14v-5"/></svg>'
      + '<strong>Drop a ZIP file here</strong><span>or click to choose a file</span>'
      + '<small class="upload-file-name">ZIP files only</small></label>',
    confirmText: 'Upload',
  });
  const dropzone = dialogEls.body.querySelector('.upload-dropzone');
  const fileInput = dialogEls.body.querySelector('.upload-file-input');
  const fileName = dialogEls.body.querySelector('.upload-file-name');
  const showFile = () => {
    fileName.textContent = fileInput.files && fileInput.files[0] ? fileInput.files[0].name : 'ZIP files only';
  };
  fileInput.addEventListener('change', showFile);
  dropzone.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      fileInput.click();
    }
  });
  ['dragenter', 'dragover'].forEach(type => dropzone.addEventListener(type, event => {
    event.preventDefault();
    if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy';
    dropzone.classList.add('drag-over');
  }));
  ['dragleave', 'drop'].forEach(type => dropzone.addEventListener(type, event => {
    event.preventDefault();
    dropzone.classList.remove('drag-over');
  }));
  dropzone.addEventListener('drop', event => {
    const files = event.dataTransfer && event.dataTransfer.files;
    if (!files || !files.length) return;
    const transfer = new DataTransfer();
    transfer.items.add(files[0]);
    fileInput.files = transfer.files;
    fileInput.dispatchEvent(new Event('change', { bubbles: true }));
  });
  const result = await resultPromise;
  if (result.action !== 'confirm') return null;
  return {
    name: includeName ? String(result.values.name || '').trim() : null,
    file: result.values.file || null,
  };
}

function setUploadBusy(button, busy, idleText) {
  uploadInFlight = busy;
  button.disabled = busy;
  if (button.classList.contains('icon-action')) {
    button.classList.toggle('uploading', busy);
    button.setAttribute('aria-label', busy ? 'Uploading…' : idleText);
    button.title = busy ? 'Uploading…' : idleText;
  } else {
    const label = button.querySelector('span');
    if (label) label.textContent = busy ? 'Uploading…' : 'Upload deck';
    else button.textContent = busy ? 'Uploading…' : idleText;
  }
  document.getElementById('lib-upload').disabled = busy;
  updateViewerActions();
}

async function refreshViewerAfterUpload(deckId) {
  const previousScreenKey = currentScreenKey;
  const previousScope = scope;
  decksLoaded = false;
  await ensureDecksLoaded();
  if (currentId !== deckId || !decks.some(deck => deck.id === deckId)) return;
  await selectDeck(deckId);
  if (previousScreenKey && screens.some(screen => screen.key === previousScreenKey)) {
    currentScreenKey = previousScreenKey;
    renderDecks();
  }
  if (previousScope === 'screen' && screens.length > 1) {
    scope = 'screen';
    document.querySelectorAll('#scope-switch button').forEach(button => {
      button.setAttribute('aria-pressed', String(button.dataset.scope === scope));
    });
    await loadVersionData();
  } else {
    document.getElementById('frame-a').src = singleFrameUrl(viewingVersion);
  }
}

async function uploadNewDeck() {
  if (uploadInFlight) return;
  const selection = await promptZipUpload({ title: 'Upload new deck', includeName: true });
  if (!selection || !selection.file) return;
  const button = document.getElementById('lib-upload');
  setUploadBusy(button, true, 'Upload');
  const form = new FormData();
  form.append('file', selection.file, selection.file.name);
  form.append('name', selection.name);
  form.append('idempotency_key', uploadIdempotencyKey('deck'));
  try {
    const created = await apiRequest('/api/v1/decks', { method: 'POST', body: form });
    await loadLibrary();
    announceLibrary('Deck ' + created.name + ' uploaded.');
  } catch (error) {
    await loadLibrary();
    await showFailureAlert(error, 'Could not upload this deck.');
  } finally {
    setUploadBusy(button, false, 'Upload');
  }
}

async function uploadNewVersion() {
  if (uploadInFlight || !currentId) return;
  const deckId = currentId;
  const selection = await promptZipUpload({ title: 'Upload new version' });
  if (!selection || !selection.file || currentId !== deckId) return;
  const button = document.getElementById('upload-version');
  setUploadBusy(button, true, 'Upload new version');
  const form = new FormData();
  form.append('file', selection.file, selection.file.name);
  form.append('idempotency_key', uploadIdempotencyKey('version'));
  try {
    await apiRequest('/api/v1/decks/' + encodeURIComponent(deckId) + '/versions', {
      method: 'POST',
      body: form,
    });
    await loadLibrary();
    await refreshViewerAfterUpload(deckId);
  } catch (error) {
    if (currentId === deckId) await loadVersionData();
    await showFailureAlert(error, 'Could not upload this version.');
  } finally {
    setUploadBusy(button, false, 'Upload new version');
  }
}

function downloadSelectedVersion() {
  const version = selectedVersionNo();
  const ready = versionData && versionData.items.some(
    item => item.version === version && item.status === 'ready'
  );
  if (!currentId || !ready) return;
  const link = document.createElement('a');
  link.href = '/api/v1/decks/' + encodeURIComponent(currentId)
    + '/download?version=' + encodeURIComponent(version);
  link.download = '';
  document.body.appendChild(link);
  link.click();
  link.remove();
}
// --- Lightweight kebab/context menus (not the dialog above; ordinary menu ---
// --- conventions apply, so outside click / Esc close them). -----------------
let openMenus = [];
let menuOpener = null;

function closeMenu(restoreFocus = false) {
  openMenus.forEach(menu => menu.remove());
  openMenus = [];
  document.removeEventListener('mousedown', onOutsideMenuClick, true);
  document.removeEventListener('keydown', onMenuKeydown, true);
  if (restoreFocus && menuOpener && menuOpener.isConnected) menuOpener.focus();
  menuOpener = null;
}

function onOutsideMenuClick(event) {
  if (openMenus.some(menu => menu.contains(event.target))) return;
  closeMenu(false);
}

function onMenuKeydown(event) {
  if (event.key === 'Escape') {
    event.preventDefault();
    closeMenu(true);
    return;
  }
  const menu = document.activeElement && document.activeElement.closest('.lib-menu');
  if (!menu) return;
  const items = Array.from(menu.querySelectorAll('.lib-menu-item:not(:disabled)'));
  if (!items.length) return;
  let index = items.indexOf(document.activeElement);
  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    event.preventDefault();
    const step = event.key === 'ArrowDown' ? 1 : -1;
    items[(index + step + items.length) % items.length].focus();
  } else if (event.key === 'Home' || event.key === 'End') {
    event.preventDefault();
    items[event.key === 'Home' ? 0 : items.length - 1].focus();
  }
}

function positionMenu(menu, anchorEl, isSubmenu) {
  const rect = anchorEl.getBoundingClientRect();
  const menuRect = menu.getBoundingClientRect();
  let top = isSubmenu ? rect.top : rect.bottom + 4;
  let left = isSubmenu ? rect.right + 4 : rect.right - menuRect.width;
  const maxLeft = window.innerWidth - menuRect.width - 8;
  const maxTop = window.innerHeight - menuRect.height - 8;
  left = Math.max(8, Math.min(left, maxLeft));
  top = Math.max(8, Math.min(top, maxTop));
  menu.style.top = top + 'px';
  menu.style.left = left + 'px';
}

function openMenu(anchorEl, items, isSubmenu) {
  if (!isSubmenu) {
    closeMenu(false);
    menuOpener = anchorEl;
  } else {
    while (openMenus.length > 1) openMenus.pop().remove();
  }
  const menu = document.createElement('div');
  menu.className = 'lib-menu';
  menu.setAttribute('role', 'menu');
  items.forEach(item => {
    if (item.separator) {
      const sep = document.createElement('div');
      sep.className = 'lib-menu-sep';
      sep.setAttribute('role', 'separator');
      menu.appendChild(sep);
      return;
    }
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'lib-menu-item'
      + (item.destructive ? ' destructive' : '')
      + (item.submenu ? ' submenu-parent' : '');
    btn.setAttribute('role', 'menuitem');
    btn.textContent = item.label;
    btn.disabled = !!item.disabled;
    if (item.submenu) {
      btn.setAttribute('aria-haspopup', 'menu');
      btn.onclick = event => {
        event.stopPropagation();
        openMenu(btn, item.submenu, true);
      };
    } else if (!item.disabled) {
      btn.onclick = event => {
        event.stopPropagation();
        closeMenu(false);
        item.onClick();
      };
    }
    menu.appendChild(btn);
  });
  document.body.appendChild(menu);
  positionMenu(menu, anchorEl, isSubmenu);
  openMenus.push(menu);
  const first = menu.querySelector('.lib-menu-item:not(:disabled)');
  if (first) first.focus();
  if (!isSubmenu) {
    document.addEventListener('mousedown', onOutsideMenuClick, true);
    document.addEventListener('keydown', onMenuKeydown, true);
  }
}

// --- Library/Home personal state (server never sees these - D0007 7) --------
const LS_PIN_KEY = 'mg.library.pinned';
const LS_RECENT_KEY = 'mg.library.recent';
const LS_COLLAPSED_KEY = 'mg.library.collapsed';
const UNGROUPED_COLLAPSE_KEY = '__ungrouped__';
const RECENT_LIMIT = 8;

function readJsonList(key) {
  try {
    const raw = localStorage.getItem(key);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (error) {
    return [];
  }
}

function writeJsonList(key, list) {
  try {
    localStorage.setItem(key, JSON.stringify(list));
  } catch (error) {
    // The in-memory state for this page load still applies.
  }
}

function getPinnedIds() { return readJsonList(LS_PIN_KEY); }
function isPinned(id) { return getPinnedIds().includes(id); }
function togglePin(id) {
  const list = getPinnedIds();
  const index = list.indexOf(id);
  if (index === -1) list.unshift(id); else list.splice(index, 1);
  writeJsonList(LS_PIN_KEY, list);
}

function getRecentIds() { return readJsonList(LS_RECENT_KEY); }
function recordRecent(id) {
  const list = getRecentIds().filter(item => item !== id);
  list.unshift(id);
  writeJsonList(LS_RECENT_KEY, list.slice(0, RECENT_LIMIT));
}

function getCollapsedIds() { return readJsonList(LS_COLLAPSED_KEY); }
function isCollapsed(id) { return getCollapsedIds().includes(id); }
function toggleCollapsed(id) {
  const list = getCollapsedIds();
  const index = list.indexOf(id);
  if (index === -1) list.push(id); else list.splice(index, 1);
  writeJsonList(LS_COLLAPSED_KEY, list);
}

// --- Library/Home data + rendering ------------------------------------------
let libraryData = null;
let libraryLoadGeneration = 0;
let organizationMoveInFlight = false;
let dragState = null;
let suppressDeckClickUntil = 0;

// Every read of the library record - Library/Home entry as well as each
// mutation's post-write reload - also drops the Viewer's separate
// GET /api/v1/decks cache. A generation guard makes overlapping reads
// latest-wins, so an older response can never overwrite a newer server record.
async function loadLibrary() {
  const generation = ++libraryLoadGeneration;
  decksLoaded = false;
  const container = document.getElementById('lib-groups');
  let nextData;
  try {
    nextData = await apiRequest('/api/v1/library');
  } catch (error) {
    if (generation !== libraryLoadGeneration) return true;
    libraryData = null;
    container.innerHTML = '<div class="lib-empty">Library is unavailable.</div>';
    document.getElementById('lib-pinned-row').hidden = true;
    document.getElementById('lib-recent-row').hidden = true;
    return false;
  }
  if (generation !== libraryLoadGeneration) return true;
  libraryData = nextData;
  pruneStaleState();
  renderLibrary();
  return true;
}

// D0007 §7: personal state pointing at a deck/group the server no longer has
// is quietly dropped (no error) whenever the library record is reloaded.
function pruneStaleState() {
  const deckIds = new Set(allLibraryDecks().map(deck => deck.id));
  const groupIds = new Set(libraryData.groups.map(group => group.id));
  groupIds.add(UNGROUPED_COLLAPSE_KEY);
  writeJsonList(LS_PIN_KEY, getPinnedIds().filter(id => deckIds.has(id)));
  writeJsonList(LS_RECENT_KEY, getRecentIds().filter(id => deckIds.has(id)));
  writeJsonList(LS_COLLAPSED_KEY, getCollapsedIds().filter(id => groupIds.has(id)));
}

function allLibraryDecks() {
  if (!libraryData) return [];
  const all = [];
  libraryData.groups.forEach(group => all.push(...group.decks));
  all.push(...libraryData.ungrouped.decks);
  return all;
}

function findLibraryDeck(id) {
  return allLibraryDecks().find(deck => deck.id === id) || null;
}

function renderShelf(sectionId, ids) {
  const section = document.getElementById(sectionId);
  const container = section.querySelector('.lib-cards');
  const found = ids.map(findLibraryDeck).filter(Boolean);
  section.hidden = found.length === 0;
  container.innerHTML = '';
  found.forEach(deck => container.appendChild(buildDeckCard(deck)));
}

function renderLibrary() {
  if (!libraryData) return;
  renderShelf('lib-pinned-row', getPinnedIds());
  renderShelf('lib-recent-row', getRecentIds());
  renderGroups(document.getElementById('lib-search').value.trim().toLowerCase());
}

// Search narrows only what is visible. Drop indexes are computed later from the
// complete server-ordered libraryData lists and stable target ids, never from a
// filtered DOM ordinal.
function renderGroups(query) {
  const container = document.getElementById('lib-groups');
  container.innerHTML = '';
  let rendered = 0;

  libraryData.groups.forEach(group => {
    let visibleDecks;
    if (!query || group.name.toLowerCase().includes(query)) {
      visibleDecks = group.decks;
    } else {
      visibleDecks = group.decks.filter(deck => deck.name.toLowerCase().includes(query));
      if (!visibleDecks.length) return;
    }
    container.appendChild(buildGroupSection(group, visibleDecks, Boolean(query)));
    rendered++;
  });

  const ungroupedDecks = query
    ? libraryData.ungrouped.decks.filter(deck => deck.name.toLowerCase().includes(query))
    : libraryData.ungrouped.decks;
  if (!query || ungroupedDecks.length) {
    container.appendChild(buildUngroupedSection(ungroupedDecks, Boolean(query)));
    rendered++;
  }

  if (!rendered) container.innerHTML = '<div class="lib-empty">No matches.</div>';
}

function clearDropHighlights() {
  document.querySelectorAll('.drop-before, .drop-after, .deck-drop-target').forEach(element => {
    element.classList.remove('drop-before', 'drop-after', 'deck-drop-target');
  });
}

function showDropHighlight(element, className) {
  clearDropHighlights();
  element.classList.add(className);
}

function startLibraryDrag(event, state, sourceElement) {
  if (organizationMoveInFlight) {
    event.preventDefault();
    return;
  }
  dragState = { ...state, sourceElement };
  sourceElement.classList.add('drag-source');
  document.getElementById('library').classList.add('dragging');
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', state.id);
}

function finishLibraryDrag() {
  if (dragState && dragState.sourceElement) dragState.sourceElement.classList.remove('drag-source');
  if (dragState && dragState.kind === 'deck') suppressDeckClickUntil = Date.now() + 300;
  dragState = null;
  clearDropHighlights();
  document.getElementById('library').classList.remove('dragging');
}

function libraryDecksFor(groupId, data = libraryData) {
  if (!data) return [];
  if (groupId === null) return data.ungrouped.decks;
  const group = data.groups.find(item => item.id === groupId);
  return group ? group.decks : [];
}

function calculateDeckIndex(deckId, groupId, targetId, position) {
  const ids = libraryDecksFor(groupId).map(deck => deck.id).filter(id => id !== deckId);
  if (targetId === null) return position === 'start' ? 0 : ids.length;
  const targetIndex = ids.indexOf(targetId);
  if (targetIndex === -1) return ids.length;
  return targetIndex + (position === 'after' ? 1 : 0);
}

function calculateGroupIndex(groupId, targetId, position) {
  const ids = libraryData.groups.map(group => group.id).filter(id => id !== groupId);
  const targetIndex = ids.indexOf(targetId);
  if (targetIndex === -1) return ids.length;
  return targetIndex + (position === 'after' ? 1 : 0);
}

function isDeckMoveNoop(deckId, groupId, index) {
  const deck = findLibraryDeck(deckId);
  if (!deck || deck.group_id !== groupId) return false;
  return libraryDecksFor(groupId).findIndex(item => item.id === deckId) === index;
}

function isGroupMoveNoop(groupId, index) {
  return libraryData.groups.findIndex(group => group.id === groupId) === index;
}

// T0014 2: dropping an item on itself is a no-op (drag UI cleanup only, zero
// mutation requests). This is checked here, before any index math, so it is the
// single source of truth - calculateDeckIndex/calculateGroupIndex already exclude
// the dragged id from the sibling list before locating the target, so a self-target
// would otherwise fall through to the ids.length "end of list" branch and be
// mistaken for a real move to the end.
function dropDeck(event, groupId, targetId, position) {
  if (!dragState || dragState.kind !== 'deck') return;
  event.preventDefault();
  event.stopPropagation();
  const deckId = dragState.id;
  const isSelfDrop = targetId === deckId;
  const index = isSelfDrop ? null : calculateDeckIndex(deckId, groupId, targetId, position);
  finishLibraryDrag();
  if (isSelfDrop || isDeckMoveNoop(deckId, groupId, index)) return;
  void dispatchOrganizationMove({ kind: 'deck', id: deckId, groupId, index });
}

function dropGroup(event, targetId, position) {
  if (!dragState || dragState.kind !== 'group') return;
  event.preventDefault();
  event.stopPropagation();
  const groupId = dragState.id;
  const isSelfDrop = targetId === groupId;
  const index = isSelfDrop ? null : calculateGroupIndex(groupId, targetId, position);
  finishLibraryDrag();
  if (isSelfDrop || isGroupMoveNoop(groupId, index)) return;
  void dispatchOrganizationMove({ kind: 'group', id: groupId, index });
}

function buildGroupHeader(name, expanded, kebabItems, groupId) {
  const header = document.createElement('div');
  header.className = 'lib-group-header';
  header.dataset.deckDropGroup = groupId === null ? '' : groupId;
  header.ondragover = event => {
    if (!dragState || dragState.kind !== 'deck') return;
    event.preventDefault();
    event.stopPropagation();
    event.dataTransfer.dropEffect = 'move';
    showDropHighlight(header, 'deck-drop-target');
  };
  header.ondrop = event => dropDeck(event, groupId, null, 'start');

  const toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'lib-group-toggle';
  toggle.setAttribute('aria-label', 'Toggle group');
  toggle.setAttribute('aria-expanded', String(expanded));
  toggle.innerHTML = '<span class="arrow">&#9662;</span>';

  const nameEl = document.createElement('span');
  nameEl.className = 'lib-group-name';
  nameEl.textContent = name;
  header.append(toggle, nameEl);

  let kebab = null;
  if (kebabItems) {
    kebab = document.createElement('button');
    kebab.type = 'button';
    kebab.className = 'lib-group-kebab';
    kebab.setAttribute('aria-label', 'Group actions');
    kebab.setAttribute('aria-haspopup', 'menu');
    kebab.textContent = '⋮';
    kebab.onclick = event => {
      event.stopPropagation();
      openMenu(kebab, kebabItems);
    };
    header.appendChild(kebab);
  }
  return { header, toggle, nameEl, kebab };
}

function buildCardsRow(decksToShow, emptyText, groupId) {
  const cards = document.createElement('div');
  cards.className = 'lib-group-cards';
  cards.dataset.deckDropGroup = groupId === null ? '' : groupId;
  cards.ondragover = event => {
    if (!dragState || dragState.kind !== 'deck') return;
    if (event.target.closest('.lib-card')) return;
    event.preventDefault();
    event.stopPropagation();
    event.dataTransfer.dropEffect = 'move';
    showDropHighlight(cards, 'deck-drop-target');
  };
  cards.ondrop = event => {
    if (event.target.closest('.lib-card')) return;
    dropDeck(event, groupId, null, 'end');
  };
  if (!decksToShow.length) {
    const empty = document.createElement('div');
    empty.className = 'lib-empty';
    empty.textContent = emptyText;
    cards.appendChild(empty);
  } else {
    decksToShow.forEach(deck => cards.appendChild(buildDeckCard(deck, { organizable: true, groupId })));
  }
  return cards;
}

function attachGroupDrag(section, nameEl, group) {
  nameEl.classList.add('lib-group-drag-handle');
  nameEl.draggable = true;
  nameEl.dataset.groupDragId = group.id;
  nameEl.ondragstart = event => startLibraryDrag(event, { kind: 'group', id: group.id }, section);
  nameEl.ondragend = finishLibraryDrag;
  section.ondragover = event => {
    if (!dragState || dragState.kind !== 'group') return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    const rect = section.getBoundingClientRect();
    const position = event.clientY < rect.top + rect.height / 2 ? 'before' : 'after';
    showDropHighlight(section, position === 'before' ? 'drop-before' : 'drop-after');
  };
  section.ondrop = event => {
    if (!dragState || dragState.kind !== 'group') return;
    const rect = section.getBoundingClientRect();
    const position = event.clientY < rect.top + rect.height / 2 ? 'before' : 'after';
    dropGroup(event, group.id, position);
  };
}

function buildGroupSection(group, decksToShow, forceExpanded) {
  const section = document.createElement('section');
  const collapsed = !forceExpanded && isCollapsed(group.id);
  section.className = 'lib-group' + (collapsed ? ' collapsed' : '');
  section.dataset.groupId = group.id;

  const { header, toggle, nameEl } = buildGroupHeader(group.name, !collapsed, [
    { label: 'Rename', onClick: () => renameGroup(group) },
    { label: 'Reorder…', onClick: () => chooseGroupReorder(group) },
    { label: 'Delete', destructive: true, onClick: () => deleteGroup(group) },
  ], group.id);
  toggle.onclick = () => {
    toggleCollapsed(group.id);
    const nowCollapsed = forceExpanded ? false : isCollapsed(group.id);
    section.classList.toggle('collapsed', nowCollapsed);
    toggle.setAttribute('aria-expanded', String(!nowCollapsed));
  };
  attachGroupDrag(section, nameEl, group);
  section.appendChild(header);
  section.appendChild(buildCardsRow(decksToShow, 'No decks in this group.', group.id));
  return section;
}

function buildUngroupedSection(decksToShow, forceExpanded) {
  const section = document.createElement('section');
  const collapsed = !forceExpanded && isCollapsed(UNGROUPED_COLLAPSE_KEY);
  section.className = 'lib-group' + (collapsed ? ' collapsed' : '');
  section.dataset.groupId = '';

  const { header, toggle } = buildGroupHeader('Ungrouped', !collapsed, null, null);
  toggle.onclick = () => {
    toggleCollapsed(UNGROUPED_COLLAPSE_KEY);
    const nowCollapsed = forceExpanded ? false : isCollapsed(UNGROUPED_COLLAPSE_KEY);
    section.classList.toggle('collapsed', nowCollapsed);
    toggle.setAttribute('aria-expanded', String(!nowCollapsed));
  };
  section.appendChild(header);
  section.appendChild(buildCardsRow(decksToShow, 'No decks.', null));
  return section;
}

function openDeckMenu(anchor, deck) {

    { label: 'Rename', onClick: () => renameDeck(deck) },
    { label: 'Move…', onClick: () => chooseDeckMove(deck) },
    { label: 'Copy link', onClick: () => copyDeckLink(deck) },
    { separator: true },
    { label: 'Delete', destructive: true, onClick: () => deleteDeck(deck) },
  ]);
}

function buildDeckCard(deck, options = {}) {
  const organizable = options.organizable === true;
  const groupId = options.groupId === undefined ? deck.group_id : options.groupId;
  const card = document.createElement('div');
  card.className = 'lib-card';
  card.dataset.deckId = deck.id;
  card.dataset.groupId = groupId === null ? '' : groupId;
  card.dataset.organizable = String(organizable);
  if (organizable) {
    card.draggable = true;
    card.ondragstart = event => {
      if (event.target.closest('button')) {
        event.preventDefault();
        return;
      }
      startLibraryDrag(event, { kind: 'deck', id: deck.id, sourceGroupId: groupId }, card);
    };
    card.ondragend = finishLibraryDrag;
    card.ondragover = event => {
      if (!dragState || dragState.kind !== 'deck' || dragState.id === deck.id) return;
      event.preventDefault();
      event.stopPropagation();
      event.dataTransfer.dropEffect = 'move';
      const rect = card.getBoundingClientRect();
      const position = event.clientY < rect.top + rect.height / 2 ? 'before' : 'after';
      showDropHighlight(card, position === 'before' ? 'drop-before' : 'drop-after');
    };
    card.ondrop = event => {
      const rect = card.getBoundingClientRect();
      const position = event.clientY < rect.top + rect.height / 2 ? 'before' : 'after';
      dropDeck(event, groupId, deck.id, position);
    };
  }

  const thumb = document.createElement('div');
  thumb.className = 'lib-card-thumb';
  if (deck.thumb_url) {
    const img = document.createElement('img');
    img.src = versionedThumbUrl(deck);
    img.alt = '';
    thumb.appendChild(img);
  } else {
    thumb.textContent = (deck.name || '?').trim().slice(0, 1).toUpperCase() || '?';
  }

  const pinned = isPinned(deck.id);
  const pin = document.createElement('button');
  pin.type = 'button';
  pin.draggable = false;
  pin.className = 'lib-pin' + (pinned ? ' pinned' : '');
  pin.setAttribute('aria-pressed', String(pinned));
  pin.setAttribute('aria-label', pinned ? 'Unpin' : 'Pin');
  pin.textContent = pinned ? '★' : '☆';
  pin.onclick = event => {
    event.stopPropagation();
    togglePin(deck.id);
    renderLibrary();
  };

  const kebab = document.createElement('button');
  kebab.type = 'button';
  kebab.draggable = false;
  kebab.className = 'lib-kebab';
  kebab.setAttribute('aria-label', 'Deck actions');
  kebab.setAttribute('aria-haspopup', 'menu');
  kebab.textContent = '⋮';
  kebab.onclick = event => {
    event.stopPropagation();
    openDeckMenu(kebab, deck);
  };

  const name = document.createElement('div');
  name.className = 'lib-card-name';
  name.textContent = deck.name;

  const meta = document.createElement('div');
  meta.className = 'lib-card-meta';
  const parts = [`v${deck.active_version}/${deck.total_versions}`];
  if (deck.latest_version_at) parts.push(formatTimestamp(deck.latest_version_at));
  if (deck.screen_count > 1) parts.push(deck.screen_count + ' screens');
  meta.textContent = parts.join(' · ');

  card.append(thumb, pin, kebab, name, meta);
  card.onclick = () => {
    if (Date.now() < suppressDeckClickUntil) return;
    location.hash = deck.id;
  };
  return card;
}

function dialogGroupValue(groupId) {
  return groupId === null ? 'ungrouped' : 'group:' + groupId;
}

function parseDialogGroupValue(value) {
  return value === 'ungrouped' ? null : value.slice('group:'.length);
}

function fillDeckPositionOptions(select, deck, groupId) {
  const siblings = libraryDecksFor(groupId).filter(item => item.id !== deck.id);
  select.innerHTML = '';
  siblings.forEach((item, index) => {
    const option = document.createElement('option');
    option.value = String(index);
    option.textContent = `${index + 1} — before ${item.name}`;
    select.appendChild(option);
  });
  const end = document.createElement('option');
  end.value = String(siblings.length);
  end.textContent = `${siblings.length + 1} — end of section`;
  select.appendChild(end);
  const currentIndex = libraryDecksFor(deck.group_id).findIndex(item => item.id === deck.id);
  select.value = String(groupId === deck.group_id ? currentIndex : siblings.length);
}

async function chooseDeckMove(deck) {
  if (!libraryData || organizationMoveInFlight) return;
  const groupOptions = [
    ...libraryData.groups.map((group, index) =>
      `<option value="${esc(dialogGroupValue(group.id))}">${index + 1} — ${esc(group.name)}</option>`),
    `<option value="ungrouped">${libraryData.groups.length + 1} — Ungrouped</option>`,
  ].join('');
  const pending = openGenericDialog({
    title: 'Move deck',
    bodyHtml: `<label class="dialog-field">Destination<select id="dialog-move-group" data-dialog-field="group">${groupOptions}</select></label>`
      + '<label class="dialog-field">Position<select id="dialog-move-index" data-dialog-field="index"></select></label>',
    confirmText: 'Move',
  });
  const groupSelect = document.getElementById('dialog-move-group');
  const indexSelect = document.getElementById('dialog-move-index');
  groupSelect.value = dialogGroupValue(deck.group_id);
  const refreshPositions = () => fillDeckPositionOptions(indexSelect, deck, parseDialogGroupValue(groupSelect.value));
  groupSelect.addEventListener('change', refreshPositions);
  refreshPositions();
  const result = await pending;
  if (result.action !== 'confirm') {
    focusLibraryItem('deck', deck.id);
    return;
  }
  await dispatchOrganizationMove({
    kind: 'deck',
    id: deck.id,
    groupId: parseDialogGroupValue(result.values.group),
    index: Number(result.values.index),
  });
}

async function chooseGroupReorder(group) {
  if (!libraryData || organizationMoveInFlight) return;
  const others = libraryData.groups.filter(item => item.id !== group.id);
  const options = others.map((item, index) =>
    `<option value="${index}">${index + 1} — before ${esc(item.name)}</option>`);
  options.push(`<option value="${others.length}">${others.length + 1} — end of groups</option>`);
  const currentIndex = libraryData.groups.findIndex(item => item.id === group.id);
  const pending = openGenericDialog({
    title: 'Reorder group',
    bodyHtml: `<label class="dialog-field">Position<select id="dialog-group-index" data-dialog-field="index">${options.join('')}</select></label>`,
    confirmText: 'Move',
  });
  document.getElementById('dialog-group-index').value = String(currentIndex);
  const result = await pending;
  if (result.action !== 'confirm') {
    focusLibraryItem('group', group.id);
    return;
  }
  await dispatchOrganizationMove({ kind: 'group', id: group.id, index: Number(result.values.index) });
}

function cloneLibraryRecord(data) {
  return JSON.parse(JSON.stringify(data));
}

function normalizeDeckSection(decks, groupId) {
  decks.forEach((deck, index) => {
    deck.group_id = groupId;
    deck.sort_order = index;
  });
}

function applyOptimisticMove(command) {
  if (command.kind === 'group') {
    const from = libraryData.groups.findIndex(group => group.id === command.id);
    if (from === -1) return;
    const [group] = libraryData.groups.splice(from, 1);
    libraryData.groups.splice(Math.max(0, Math.min(command.index, libraryData.groups.length)), 0, group);
    libraryData.groups.forEach((item, index) => { item.sort_order = index; });
    return;
  }
  let moved = null;
  for (const group of libraryData.groups) {
    const index = group.decks.findIndex(deck => deck.id === command.id);
    if (index !== -1) moved = group.decks.splice(index, 1)[0];
    normalizeDeckSection(group.decks, group.id);
  }
  const ungroupedIndex = libraryData.ungrouped.decks.findIndex(deck => deck.id === command.id);
  if (ungroupedIndex !== -1) moved = libraryData.ungrouped.decks.splice(ungroupedIndex, 1)[0];
  normalizeDeckSection(libraryData.ungrouped.decks, null);
  if (!moved) return;
  const target = libraryDecksFor(command.groupId);
  target.splice(Math.max(0, Math.min(command.index, target.length)), 0, moved);
  normalizeDeckSection(target, command.groupId);
}

function focusLibraryItem(kind, id) {
  const escapedId = CSS.escape(id);
  const selector = kind === 'deck'
    ? `#lib-groups .lib-card[data-deck-id="${escapedId}"] .lib-kebab`
    : `#lib-groups .lib-group[data-group-id="${escapedId}"] .lib-group-kebab`;
  const target = document.querySelector(selector);
  if (target) target.focus();
}

function announceLibrary(message) {
  const live = document.getElementById('lib-live');
  live.textContent = '';
  requestAnimationFrame(() => { live.textContent = message; });
}

async function dispatchOrganizationMove(command) {
  if (!libraryData || organizationMoveInFlight) return false;
  if (command.kind === 'deck' && isDeckMoveNoop(command.id, command.groupId, command.index)) {
    focusLibraryItem('deck', command.id);
    return true;
  }
  if (command.kind === 'group' && isGroupMoveNoop(command.id, command.index)) {
    focusLibraryItem('group', command.id);
    return true;
  }

  organizationMoveInFlight = true;
  const snapshot = cloneLibraryRecord(libraryData);
  applyOptimisticMove(command);
  renderLibrary();
  let moveError = null;
  try {
    const url = command.kind === 'deck'
      ? '/api/v1/decks/' + encodeURIComponent(command.id) + '/move'
      : '/api/v1/groups/' + encodeURIComponent(command.id) + '/move';
    const body = command.kind === 'deck'
      ? { group_id: command.groupId, index: command.index }
      : { index: command.index };
    await apiRequest(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
  } catch (error) {
    moveError = error;
    libraryData = snapshot;
    renderLibrary();
  }

  const refreshed = await loadLibrary();
  organizationMoveInFlight = false;
  if (!refreshed) {
    await showFailureAlert(moveError || new Error('The updated library could not be reloaded.'), 'Could not refresh the library.');
    return false;
  }
  if (moveError) {
    await showFailureAlert(moveError, command.kind === 'deck' ? 'Could not move this deck.' : 'Could not reorder this group.');
    focusLibraryItem(command.kind, command.id);
    announceLibrary('Move failed. Server order restored.');
    return false;
  }
  focusLibraryItem(command.kind, command.id);
  announceLibrary(command.kind === 'deck' ? 'Deck moved.' : 'Group reordered.');
  return true;
}

// --- Root routing (D0007 3.1 / T0010 §1.1) -----------------------------------
// No hash -> Library/Home. A hash with a deck id -> that deck's Viewer, exactly
// like a bookmark. A hash whose deck cannot be found (deleted, typo, stale link)
// bounces back to Library/Home with a custom alert instead of guessing.
function showLibraryScreen() {
  document.getElementById('app').hidden = true;
  document.getElementById('library').hidden = false;
  railScopeIds = null;
  loadLibrary();
}

function showViewerScreen() {
  document.getElementById('library').hidden = true;
  document.getElementById('app').hidden = false;
}

async function ensureDecksLoaded() {
  if (decksLoaded) return;
  try {
    const response = await fetch('/api/v1/decks', { cache: 'no-store' });
    const data = await response.json();
    decks = data.items || [];
    decksLoadFailed = false;
  } catch (error) {
    decks = [];
    decksLoadFailed = true;
  }
  decksLoaded = true;
}

// T0014 4 / T0016 4: the Viewer rail only shows decks from deckId's Library group
// (or only Ungrouped decks, when deckId itself is Ungrouped), in that group's own
// server order. Membership and order are resolved fresh from /api/v1/library -
// the same server-authoritative listing Library itself renders from - every time
// a deck is opened, never from which Library shelf/card was clicked to get here.
// That keeps grouped/Ungrouped open, direct #deck_id open, and switching decks
// from inside the rail all consistent, and picks up a group change (or reorder)
// made in Library without needing a full page reload. A failed lookup (offline,
// 5xx) or a current deck missing from the response (deleted mid-navigation, stale
// membership) fails closed to just [deckId] - it must never widen back to every
// deck in the rail.
//
// T0016 review (rej_01M33JG3BQCB2DAF): this only *resolves* the scope and
// returns it - it must never write the shared railScopeIds itself. It used to,
// which meant a stale call (superseded by a newer hashchange while its own
// /api/v1/library fetch was still in flight) could still overwrite the rail
// out from under whichever deck is now actually showing the moment its
// response landed, regardless of any generation check the caller ran
// afterwards. The caller alone decides, after re-checking navGeneration, when
// (and whether) a resolved scope is actually current enough to commit.
async function loadRailScope(deckId) {
  try {
    const response = await fetch('/api/v1/library', { cache: 'no-store' });
    if (!response.ok) throw new Error('library unavailable');
    const library = await response.json();
    const group = library.groups.find(item => item.decks.some(deck => deck.id === deckId));
    if (group) {
      return group.decks.map(deck => deck.id);
    }
    if (library.ungrouped.decks.some(deck => deck.id === deckId)) {
      return library.ungrouped.decks.map(deck => deck.id);
    }
    return [deckId];
  } catch (error) {
    return [deckId];
  }
}

// T0016 review (rej_01M33H6TVQ61HBCX): a hashchange fires a brand new async
// openDeckFromHash() without waiting for any call already in flight. Rapid
// deck switches (rail clicks, back/forward, typed hashes) can therefore have
// two calls in flight at once, and network timing decides nothing about which
// one is "latest" - an earlier call whose ensureDecksLoaded()/loadRailScope()
// await happens to resolve after a later call's already reached selectDeck()
// would otherwise still go on to flip the screen, record-recent, and
// re-select its own (now stale) deck, stomping the newer navigation the user
// actually landed on. navGeneration is bumped once per route() dispatch (the
// same latest-wins generation-counter shape loadLibrary() already uses for
// its own overlapping reads, see libraryLoadGeneration above); every call
// captures its own generation and re-checks it against the live counter after
// each await, so only the most recently dispatched route can still be running
// by the time it reaches the state-mutating tail (showViewerScreen onward).
let navGeneration = 0;

async function openDeckFromHash(id, generation) {
  // Every hash entry - typed/bookmarked link, browser back/forward, or a rail
  // click (whose onclick only ever writes location.hash, see renderDecks() -
  // T0016 2 made this the single navigation owner; selectDeck() itself never
  // touches location.hash, so there is no recursive re-entry through here) -
  // re-checks the server directly instead of trusting whatever the decks cache
  // currently holds. Viewer-to-Viewer navigation never passes through Library,
  // so a decksLoaded cache left over from a previous deck would otherwise still
  // read as "fresh" while another session deleted or renamed this id in the
  // meantime (D0007 3.1, 3.7).
  decksLoaded = false;
  await ensureDecksLoaded();
  if (generation !== navGeneration) return;
  const deck = decks.find(item => item.id === id);
  if (!deck) {
    location.hash = '';
    showLibraryScreen();
    await showAlert({
      title: 'Deck not found',
      bodyHtml: '<p>This deck no longer exists or is unavailable.</p>',
    });
    return;
  }
  const scope = await loadRailScope(id);
  if (generation !== navGeneration) return;
  railScopeIds = scope;
  showViewerScreen();
  recordRecent(id);
  renderDecks();
  await selectDeck(id);
}

function route() {
  const id = location.hash.slice(1);
  const generation = ++navGeneration;
  if (!id) {
    showLibraryScreen();
    return;
  }
  openDeckFromHash(id, generation);
}

document.getElementById('to-library').onclick = () => {
  location.hash = '';
};

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
